<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arakanese Dictionary</title>
    <link rel="stylesheet" href="AllUserList-AD.css">
</head>
<body>
<div id="login-screen" style="text-align:center; padding-top:100px;">
    <h2>Admin Login လိုအပ်သည်</h2>
    <button id="admin-login-btn" style="padding:12px 20px;">Google နဲ့ ဝင်မယ်</button>
    <p id="login-status"></p>
</div>


    <div class="notepad-container">
        
<!-- Screen 1  Main ဆ ============= ============ ============ ============ -->
<div id="main-screen" class="screen">
            <header>
                <h2>📝 AD - User List </h2>
            </header>
            
            <main class="content-area">
                <div id="expandable-list">
                
                </div>
            </main>

            <div class="bottom-toolbar" id="main-toolbar" style="display: flex; overflow-x: auto; white-space: nowrap; padding: 10px; background: #605639; gap: 10px; -webkit-overflow-scrolling: touch; width: 100%; box-sizing: border-box;">
                <button id="new-word-btn" class="toolbar-btn add-btn" style="flex-shrink: 0; margin: 0;">➕ New </button>
                <button id="view-users-btn" style="padding: 8px 16px; background: #e6dbb3; color: #605639; border: none; border-radius: 20px; font-weight: bold; flex-shrink: 0; cursor: pointer;">👥 Users</button>
<!-- Screen 1  လော့အင် စ ============= ============ ============ ============ -->
<button id="login-btn">Google နဲ့ဝင်မယ်</button>
<button id="logout-btn" style="display:none">ထွက်မယ်</button>
<span id="user-email"></span>
<!-- Screen 1  လော့အင် ဆ ============= ============ ============ ============ -->
             
<select id="sort-select" style="padding: 8px 16px; background: #e6dbb3; color: #605639; border: none; border-radius: 20px; font-weight: bold; flex-shrink: 0; cursor: pointer; outline: none;">
     <option value="alphabet">🔠 အက္ခရာစဉ် (မူလ)</option>
     <option value="pos">📝 အမျိုးအစား</option>
     <option value="semantic">🏷️ အမျိုးအမည်</option>
</select>

<select id="Screen-select" style="padding: 8px 16px; background: #e6dbb3; color: #605639; border: none; border-radius: 20px; font-weight: bold; flex-shrink: 0; cursor: pointer; outline: none;">
    <option value="https://arakanartarea.github.io/AAA-NotePL/AAA/AAA_Index.html">🎙️ ArakanArtArea</option>
    <option value="https://arakanartarea.github.io/AAA-NotePL/ASD/AllUserList-AD.html">🎙️ AAA AllUserList</option>
    
    <option value="https://arakanartarea.github.io/AAA-NotePL/ASD/ASD_inbox.html">📝 သတ်ပုံကျမ်း ( လက်ခံဝဘ် )</option>
    <option value="https://arakanartarea.github.io/AAA-NotePL/ASD/ArakaneseSpellingDict_index.html">📝 သတ်ပုံကျမ်း (ပြသ)</option>
    
    <option value="https://arakanartarea.github.io/AAA-NotePL/ASD/#">📝 အဘိဓာန် (လက်ခံဝဘ်) မရှိသေး...</option>
    <option value="https://arakanartarea.github.io/AAA-NotePL/ASD/ArakaneseDictionary_Index.html">📝 အဘိဓာန်(ပြသ) </option>
    
</select>
            </div>
        </div>
<!-- Screen 1  Main ဆ ============= ============ ============ ============ -->

<!-- Screen 2 View ဆ ============= ============ ============ ============ ============  -->

            <div class="bottom-toolbar">
                <button id="back-main-btn" class="toolbar-btn">⬅️ Back to List</button>
            </div>
        </div>
<!-- Screen 2 View ဆ ============= ============ ============ ============ ============ -->

<!-- Screen 3 edit ဆ ============= ============ ============ ============ ============ -->
<div id="edit-screen" class="screen hidden">
    <header>
        <h2>✍️ Add/Edit User</h2>
    </header>
    <main class="content-area">
        <div class="input-form" style="display: flex; flex-direction: column; gap: 12px; padding: 10px;">
            
<div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; gap: 8px;">
        <span style="padding: 8px; background: #e6dbb3; border-radius: 4px 0 0 4px;">A-</span>
        <input type="text" id="subGroup" placeholder="ဂဏန်း 7 လုံးတိတိ" style="flex: 1; margin: 0; border-radius: 0 4px 4px 0;" maxlength="7">
        <button type="button" id="check-aid-btn" style="padding: 0 15px; background: #605639; color: white; border: none; border-radius: 4px; cursor: pointer;">စစ်</button>
    </div>
    <small id="aid-error" style="color: red; display: none; margin-left: 5px;"></small>
</div>

            
            <div style="display: flex; gap: 8px;">
                <input type="text" id="pos" placeholder="၂။ GID" style="flex: 1; margin: 0;">
                <button type="button" style="padding: 0 15px; background: #605639; color: white; border: none; border-radius: 4px; cursor: pointer;">✨</button>
            </div>
            
            <div style="display: flex; gap: 8px;">
                <input type="text" id="definition" placeholder="၃။ Name" style="flex: 1; margin: 0;">
                <button type="button" style="padding: 0 15px; background: #605639; color: white; border: none; border-radius: 4px; cursor: pointer;">✨</button>
            </div>
            
            <div style="display: flex; gap: 8px;">
                <input type="text" id="example" placeholder="၄။ Account" style="flex: 1; margin: 0;">
                <button type="button" style="padding: 0 15px; background: #605639; color: white; border: none; border-radius: 4px; cursor: pointer;">✨</button>
            </div>
            
            <div style="display: flex; gap: 8px;">
                <input type="text" id="english" placeholder="၅။ Time" style="flex: 1; margin: 0;">
                <button type="button" style="padding: 0 15px; background: #605639; color: white; border: none; border-radius: 4px; cursor: pointer;">✨</button>
            </div>
            
<div style="display: flex; gap: 8px;">
    <select id="pronounce" style="flex: 1; margin: 0; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <option value="Viewer" selected>Viewer</option>
        <option value="Editor">Editor</option>
        <option value="Admin">Admin</option>
        <option value="Banned">Banned</option>
    </select>
    <button type="button" style="padding: 0 15px; background: #605639; color: white; border: none; border-radius: 4px; cursor: pointer;">▼</button>
</div>
            
</div>
    </main>
    <div class="bottom-toolbar split-buttons">
        <button id="cancel-edit-btn" class="toolbar-btn cancel-btn">⬅️ Back</button>
        <button id="save-word-btn" class="toolbar-btn save-btn">💾 Save User</button>
    </div>
</div>
<!-- Screen 3 edit ဆ ============= ============ ============ ============ ============ -->



<script type="module" src="AllUserList-AD.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

/* ===== ၁. နေ့/ည အရောင် ဗူး ===== */
:root {
  --bar-bg: white;
  --item-color: #8a7e6f;
  --active-bg: #3d2e1f;
  --active-text: white;
  --page-bg: #fdf8ef;
  --header-bg: white;
    /* Search အတွက် အသစ် */
  --search-bg: #f1f1f1;      /* Search Box နောက်ခံ - နည်းနည်းပြာ */
  --search-border: #ddd;     /* Border - ခဲရောင် */
  --main-text: black;      /* စာသား - အမဲ */

}
@media (prefers-color-scheme: dark) {
  :root {
    --bar-bg: #1e1e1e;
    --item-color: #cccccc;
    --active-bg: white;
    --active-text: black;
    --page-bg: #121212;
    --header-bg: #1e1e1e;
      /* Search အတွက် ညမုဒ် */
  --search-bg: #2a2a2a;      /* Box ကို မဲပြာလေး */
  --search-border: #444;     /* Border ကို ဖြူဖျော့ဖျော့ */
  --main-text: white;      /* စာသားကို ဖြူ */
  }
}
/* ကိုယ်ထည်  ========= Body=========================================*/ 
body.dark {
  --bar-bg: #1e1e1e;
  --item-color: #cccccc;
  --active-bg: white;
  --active-text: black;
  --page-bg: #121212;
  --header-bg: #1e1e1e;
    /* Search အတွက် ညမုဒ် */
  --search-bg: #2a2a2a;      /* Box ကို မဲပြာလေး */
  --search-border: #444;     /* Border ကို ဖြူဖျော့ဖျော့ */
  --main-text: white;      /* စာသားကို ဖြူ */
}
body { 
  background: var(--page-bg); 
  margin: 0; 
  height: 100dvh; /* 100vh ထက် 100dvh က ဖုန်းမှာ ပိုမှန်တယ် */
  display: flex;
  flex-direction: column; /* အပေါ် -> အောက် စီမယ် */
  font-family: sans-serif;
  transition: background 0.3s;
}

/*  ခေါင်းစည်းဘား ========= Header =========================================*/ 
/* ===== ၃. အထပ် ၃ ထပ် ===== */
.header {
  /* height:10% ကို ဖြုတ် */
  height: auto; /* အထဲက Search Box အမြင့်အတိုင်း အလိုလို ယူ */
  padding: 12px 15px; /* အပေါ်အောက် 12px ခွာပေး - ဒါက အဓိက */
  background: var(--header-bg);
  display: flex;
  align-items: center;
}
/* အထဲက ၂ မျိုးလုံး အပြည့်ယူ */
.main-header, .search-header{
  width:100%;
}

/* ရှာဖွေရေး  ========= Search Box=========================================*/ 
.search-box{
  display:flex;
  align-items:center;
  background:var(--search-bg);      /* page-bg မဟုတ်တော့ */
  border:1px solid var(--search-border); /* #ddd မဟုတ်တော့ */
  border-radius:12px;
  padding:8px 12px;
  gap:8px;
}
.search-box input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-size:16px;
  color:var(--main-text); /* စာသားအရောင် - ညမှာ ဖြူလာမယ် */
}
.search-box .material-icons{
  color:var(--main-text); /* Search icon လည်း ဖြူလာအောင် */
  opacity:0.6;
}
#clearBtn{
  border:none;
  background:#eee;
  width:24px;
  height:24px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
  line-height:1;
}

/* ပေ့ခ်ျ */ 
.page {
  flex: 1; /* ကျန်တာ အကုန် သူ့အပိုင် - ဒါက 80% အစား */
  overflow-y: auto;
}

/*  တူးဘား ========= toolbar=========================================*/ 
/* တူးဘား */
.toolbar-wrapper {
  /* height:10% ကို ဖြုတ် */
  height: auto; /* တူးဘား အမြင့်အတိုင်း */
  padding: 12px 0 20px 0; /* အောက်နားနည်းနည်းပိုခွာ - ဖုန်းမှာ လက်နဲ့ ထိရလွယ်အောင် */
  display: flex;
  justify-content: center;
  background: transparent;
}
.toolbar{ 
  display:flex; 
  background:var(--bar-bg); 
  padding:8px; 
  border-radius:25px; 
  gap:5px; }
.item{ 
  display:flex; 
  flex-direction:column; 
  align-items:center; 
  padding:12px 22px; 
  border-radius:18px; 
  color:var(--item-color); 
  border:none;
  background:transparent; 
  cursor:pointer; }
.item.active{ 
  background:var(--active-bg); 
  color:var(--active-text); }
  
/* အိုင်ကွန် စ */
.icon-svg{
  width:24px;
  height:24px;
}

/* --- နေ့မုဒ် --- */
/* ပုံမှန် ခလုတ်: Icon အနက် (မူရင်းအတိုင်း) */
.item:not(.active) .icon-svg{
  filter: none;
  opacity: 0.8;
}
/* Active ခလုတ်: နောက်ခံ အနက် -> Icon အဖြူ */
.item.active .icon-svg{
  filter: invert(1);
}

/* --- ညမုဒ် --- */
/* ပုံမှန် ခလုတ်: တူးဘား အနက်ပေါ်မှာ Icon ကို အဖြူ ပြောင်း - ဒါ အဓိက */
body.dark .item:not(.active) .icon-svg{
  filter: invert(1);
  opacity: 0.9;
}
/* Active ခလုတ်: နောက်ခံ အဖြူ -> Icon အနက် ပြန်ထား */
body.dark .item.active .icon-svg{
  filter: none;
}

/* အိုင်ကွန် ဆ */

/* menu စ */
/* ===== Menu - အမှန် ===== */
.menu-wrapper{
  position: relative;
}
.menu{
  position: absolute;
  bottom: 100%;
  right: 0;
  margin-bottom: 12px;
  background: var(--header-bg); /* bar-bg မဟုတ် header-bg */
  border: 1px solid var(--search-border);
  border-radius: 16px;
  padding: 6px;
  min-width: 180px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  z-index: 100;
}
.menu-item{
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  background: transparent;
  color: var(--main-text); /* var(--text) မဟုတ် var(--main-text) */
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
}
.menu-item:hover{
  background: var(--search-bg);
}
.menu-item .arrow{
  margin-left: auto;
}
.submenu{
  position: absolute;
  top: 0;
  left: 100%;
  margin-left: 8px;
  background: var(--header-bg);
  border: 1px solid var(--search-border);
  border-radius: 16px;
  padding: 6px;
  min-width: 140px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  z-index: 101;
}
/* Menu ထဲက Icon အတွက် */
.menu-item .icon-svg{
  width:20px;
  height:20px;
}
body.dark .menu-item:not(.active) .icon-svg{
  filter: invert(1); /* ညမုဒ်မှာ Menu Icon အဖြူ */
}

@media (max-width: 400px){
  .submenu{
    left: auto;
    right: 100%;
    margin-left: 0;
    margin-right: 8px;
  }
}
/* menu ဆ */

/* မစ်ဆေ့ */ 
.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#333;
  color:white;
  padding:10px 16px;
  border-radius:20px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:999;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

</style>

</head>

<body>
<div class="header">
  <!-- ၁. ပုံမှန် အချိန် ပြမယ့် ဟာ -->
  <div id="mainHeader" class="main-header">
    <h3>စမ်းသပ် </h3>
  </div>
  
  <!-- ၂. Search နှိပ်မှ ပြမယ့် ဟာ -->
  <div id="searchHeader" class="search-header" style="display:none;">
    <div class="search-box">
      <span class="material-icons">search</span>
      <input type="text" id="searchInput" placeholder="Search...">
      <button id="clearBtn" onclick="clearSearch()">×</button>
    </div>
  </div>
</div>

<div class="page">စာတွေ</div>

<!-- တူးဘား စ -->
<div class="toolbar-wrapper">

<div class="toolbar">
  <!-- ဒါတွေက အလုပ်တူ - id မလို -->
  <button class="item active" onclick="setActive(this)">
    <img src="icons/home.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/home/default/24px.svg';" class="icon-svg">Home
  </button>
  <button class="item" onclick="setActive(this)">
    <img src="icons/favorite.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/favorite/default/24px.svg';" class="icon-svg">Saved
  </button>
  <button class="item" onclick="setActive(this)">
    <img src="icons/grid_view.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/grid_view/default/24px.svg';" class="icon-svg">Explore
  </button>
  <!-- ဒါက အလုပ်ကွဲ - Search - id ပေး -->
  <button class="item" id="searchBtn" onclick="toggleSearch()">
    <img src="icons/search.svg" id="searchIcon" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/search/default/24px.svg';" class="icon-svg">Search
  </button>
  <button class="item" onclick="setActive(this)">
    <img src="icons/person.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/person/default/24px.svg';" class="icon-svg">Profile
  </button>
  

  <!-- တူးဘား ဆက်တင်မီနူး စ -->
  <div class="menu-wrapper">
    <button class="item" id="settingsBtn" onclick="toggleMenu()">
      <img src="icons/settings.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/settings/default/24px.svg';" class="icon-svg">Settings
    </button>
    <!-- Menu အကြီး -->
    <div id="mainMenu" class="menu" style="display:none;">
      <button class="menu-item" id="authItem">
        <img src="icons/login.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/login/default/24px.svg';" class="icon-svg"><span>Login</span>
      </button>
<button class="menu-item" id="aboutMeBtn" onclick="showToast('About Me')">
  <img src="icons/person.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/person/default/24px.svg';" class="icon-svg"><span>About Me</span>
</button>
      <!-- Sort ကို Wrapper ခံလိုက် -->
      <div class="menu-item-wrap" style="position:relative;">
        <button class="menu-item" id="sortItem" onclick="toggleSubMenu('sortSub')">
          <img src="icons/sort.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/sort/default/24px.svg';" class="icon-svg"><span>Sort</span><span class="arrow">›</span>
        </button>
        <!-- Sort ရဲ့ Sub က သူ့အထဲမှာပဲ နေရမယ် -->
        <div id="sortSub" class="submenu" style="display:none;">
          <button class="menu-item">A-Z ✓</button>
          <button class="menu-item">Date</button>
        </div>
      </div>
  
      <!-- Theme လည်း အတူတူ -->
      <div class="menu-item-wrap" style="position:relative;">
        <button class="menu-item" id="themeItem" onclick="toggleSubMenu('themeSub')">
          <img src="icons/settings_brightness.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/dark_mode/default/24px.svg';" class="icon-svg"><span>D/N Mode</span><span class="arrow">›</span>
        </button>
<div id="themeSub" class="submenu" style="display:none;">
  <button class="menu-item" data-theme="light">Light</button>
  <button class="menu-item" data-theme="dark">Dark</button>
  <button class="menu-item" data-theme="auto">Auto</button>
</div>
      </div>
  
      <button class="menu-item" id="trashItem">
        <img src="icons/delete.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/delete/default/24px.svg';" class="icon-svg"><span>Trash</span>
      </button>
      
    </div>
  </div>
  <!-- တူးဘား ဆက်တင်မီနူး ဆ -->
    <!-- တူးဘား လင့်မီနူး စ -->
  <!-- အခြားလင့်များ - အသစ် -->
<div class="menu-wrapper">
<button class="item" id="moreLinkBtn" onclick="toggleLinkMenu()">
    <img src="icons/language.svg" onerror="this.onerror=null; this.src='https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/language/default/24px.svg';" class="icon-svg">အခြားလင့်များ
  </button>
  <div id="linkMenu" class="menu" style="display:none;">
    <button class="menu-item" onclick="window.open('https://...','_blank')">လင့်၁</button>
    <button class="menu-item" onclick="window.open('https://...','_blank')">လင့်၂</button>
    <button class="menu-item" onclick="window.open('https://...','_blank')">လင့်၃</button>
  </div>
</div>
  <!-- တူးဘား လင့်မီနူး ဆ  -->
  
</div>

  </div> <!-- တူးဘား ဆ -->

<!-- မစ်ဆေ့  -->
<div id="toast" class="toast"></div>

<script>
  // ၁. တူးဘား ခလုတ် active ဖြစ်ဖို့
function setActive(el) {
  document.querySelectorAll('.item').forEach(i => {
    if (i !== el || el.innerText.includes('Theme') === false) {
      // Theme ခလုတ်ကလွဲရင် active ဖြုတ်မယ်
    }
  });
  // Theme ခလုတ်မဟုတ်မှ active လုပ်
  if (!el.innerText.includes('Theme')) {
    document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
  }
}


// ရှာဖွေရေး //
let isSearchOn = false;
function toggleSearch(){
  isSearchOn = !isSearchOn;
  const icon = document.getElementById('searchIcon');
  
  if(isSearchOn){
    icon.innerText = "close";
    document.getElementById('mainHeader').style.display = "none";
    document.getElementById('searchHeader').style.display = "block";
    document.getElementById('searchInput').focus(); // စာရိုက်ဖို့ တန်း focus
  } else {
    icon.innerText = "search";
    document.getElementById('mainHeader').style.display = "block";
    document.getElementById('searchHeader').style.display = "none";
  }
}
function clearSearch(){
  document.getElementById('searchInput').value = ""; // စာအကုန်ဖျက်
}

// မီနူး ======Menu + subMenu
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Menu အကြီး ပေါ်/ပျောက်
// ဆက်တင် မီနူး
function toggleMenu() {
  const menu = document.getElementById('mainMenu');
  const isHidden = menu.style.display === 'none' || menu.style.display === '';
  
  // 1. အသစ် - LinkMenu ရှိနေရင် ပိတ်လိုက် (ဒါ ၁ ကြောင်း ထပ်)
  const linkMenu = document.getElementById('linkMenu');
  if (linkMenu) linkMenu.style.display = 'none';
  
  // SubMenu တွေ အကုန် အရင်ပိတ်
  document.getElementById('sortSub').style.display = 'none';
  document.getElementById('themeSub').style.display = 'none';
  
  if (isHidden) {
    menu.style.display = 'block';
  } else {
    menu.style.display = 'none';
  }
}

// လင့်မီနူး
function toggleLinkMenu() {
  const menu = document.getElementById('linkMenu');
  const isHidden = menu.style.display === 'none' || menu.style.display === '';
  
  // 2. Settings နဲ့ သူ့ရဲ့ SubMenu တွေ ပိတ်လိုက် (ဒါ ၃ ကြောင်း ထပ်)
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('sortSub').style.display = 'none';
  document.getElementById('themeSub').style.display = 'none';
  
  if (isHidden) {
    menu.style.display = 'block';
  } else {
    menu.style.display = 'none';
  }
}

// SubMenu ဆင့်ပွား ဆက်တင်မီနူး
function toggleSubMenu(id) {
  const sub = document.getElementById(id);
  const otherId = id === 'sortSub' ? 'themeSub' : 'sortSub';
  
  document.getElementById(otherId).style.display = 'none';
  
  if (sub.style.display === 'none' || sub.style.display === '') {
    sub.style.display = 'block';
  } else {
    sub.style.display = 'none';
  }
}


// Menu Item တွေ နှိပ်ရင် - လောလောဆယ် စနစ်မရှိ Toast
document.getElementById('authItem').onclick = () => showToast('Login စနစ် မရှိသေးပါ');
document.getElementById('trashItem').onclick = () => showToast('Trash စနစ် မရှိသေးပါ');

// Sort / Theme SubMenu Item တွေ
document.querySelectorAll('#sortSub .menu-item').forEach(btn => {
  btn.onclick = () => showToast('Sort: ' + btn.innerText + ' - စနစ် မရှိသေးပါ');
});
document.querySelectorAll('#themeSub .menu-item').forEach(btn => {
  btn.onclick = () => showToast('Theme: ' + btn.innerText + ' - စနစ် မရှိသေးပါ');
});

// အပြင်နှိပ်ရင် Menu ပိတ်အောင်
document.addEventListener('click', (e) => {
  const wrapper = document.querySelector('.menu-wrapper');
  if (!wrapper.contains(e.target)) {
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('sortSub').style.display = 'none';
    document.getElementById('themeSub').style.display = 'none';
  }
});


// --- Theme ၃ မျိုး စနစ် ---
function setTheme(mode) {
  // mode = light / dark / auto
  localStorage.setItem('app-theme', mode);
  
  if (mode === 'auto') {
    // ဖုန်းရဲ့ Theme အတိုင်း လိုက်
    const isPhoneDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.body.classList.toggle('dark', isPhoneDark);
  } else if (mode === 'dark') {
    document.body.classList.add('dark');
  } else {
    document.body.classList.remove('dark');
  }
  
  updateThemeCheck(mode);
  // Menu ပိတ်
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('themeSub').style.display = 'none';
  document.getElementById('sortSub').style.display = 'none';
}

function updateThemeCheck(activeMode) {
  document.querySelectorAll('#themeSub .menu-item').forEach(btn => {
    let label = btn.dataset.theme;
    label = label.charAt(0).toUpperCase() + label.slice(1); // Light
    btn.textContent = label + (btn.dataset.theme === activeMode ? ' ✓' : '');
  });
}

// ခလုတ် ၃ ခု နှိပ်ရင်
document.querySelectorAll('#themeSub .menu-item').forEach(btn => {
  btn.onclick = () => setTheme(btn.dataset.theme);
});

// App စဖွင့်ချင်း - အရင် ရွေးထားတာကို ပြန်တင်
const savedTheme = localStorage.getItem('app-theme') || 'auto';
setTheme(savedTheme);

// ဖုန်းက နေ့/ည ပြောင်းရင် Auto က လိုက်ပြောင်းဖို့
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (localStorage.getItem('app-theme') === 'auto') {
    setTheme('auto');
  }
});

</script>

</body>
</html>

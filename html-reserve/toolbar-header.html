<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
:root{ 
 --row-h: 
  clamp(44px, 10vw, 56px); 
 --bg-day:#e3f2fd; 
 --bg-night:#2a2a2a; 
 --toolbar-bg-day:#e3f2fd; 
 --toolbar-bg-night:#1a1a1a; 
 --search-box-day:#fff; --search-text-day:#111; --search-border-day:#888;
 --search-box-night:#2a2a2a; --search-text-night:#fff; --search-border-night:#555;
}
 
html[data-theme="light"]{ 
  --bg:var(--toolbar-bg-day); --icon:#111; }
html[data-theme="dark"]{ 
  --bg:var(--toolbar-bg-night); --icon:#fff; }
html[data-theme="light"]{ 
  --search-box:var(--search-box-day); --search-text:var(--search-text-day); --search-border:var(--search-border-day); }
html[data-theme="dark"]{ 
  --search-box:var(--search-box-night); --search-text:var(--search-text-night); --search-border:var(--search-border-night); }

*{box-sizing:border-box;margin:0;padding:0}

.header-row{
  width:100%; height:var(--row-h);
  position:fixed; top:0; left:0; right:0;
  background:var(--bg-day); border-bottom:1px solid #333;
  display:flex; align-items:stretch; /* center ကနေ stretch */
  justify-content:space-between;
  padding:0; z-index:900; box-sizing:border-box;
}
html[data-theme="dark"] .header-row{ background:var(--bg-night); }

.header-left{ 
  flex:1; min-width:0; height:100%; display:flex; align-items:stretch; overflow:hidden; padding:0; margin:0; }

/* layout 1,2 ဘာအရွယ်မှ မပေး - အပြည့်ယူခိုင်း */
.header-layout{ width:100%; height:100%; display:flex; align-items:stretch; }
.header-layout.hidden{ display:none !important; }
.layout1{ background:var(--bg-day); padding:0; }
html[data-theme="dark"] .layout1{ background:var(--bg-night); }

.header-wrapper{ 
  width:100%; height:100%; 
  display:flex; align-items:center; justify-content:space-between; 
  gap:10px; 
  padding:0 10px; /* ဘယ်ညာ 10px ချန် */
  box-sizing:border-box; 
}
.nav-flag{ width:28px; height:28px; flex-shrink:0; }

.brand-container{ flex:1; height:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.scrolling-text{
  display:flex; flex-direction:column; align-items:center;
  animation: scrollUp 6s linear infinite;
}
.nav-text-item{
  height:var(--row-h); display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:16px; letter-spacing:0.5px;
  /* ၃ ရောင် ရောထားတဲ့ gradient text */
  background: linear-gradient(90deg, #2e7bff 0%, #ffffff 50%, #ff2e2e 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  /* လှအောင် glow */
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  animation: shine 3s linear infinite;
}
html[data-theme="light"] .nav-text-item{
  background: linear-gradient(90deg, #0a3d9c 0%, #111 50%, #b80000 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:none;
}

@keyframes shine{
  0%{ background-position:0% 50%; }
  100%{ background-position:200% 50%; }
}


@keyframes scrollUp{
  0%{ transform:translateY(75%); }
  100%{ transform:translateY(-75%); }
}




/* ရှာဖွေရေး */
.search-box{
  width:100%; height:100%;
  display:flex; align-items:stretch;
  background:var(--search-box); 
  border:none; /* border အသေ ဖြုတ် */
  border-radius:0;
  box-sizing:border-box;
  overflow:hidden;
}
#searchInput{
  flex:1; height:100%; width:100%;
  border:none; outline:none; border-radius:0; /* အသေ ဖြုတ် */
  background:transparent; color:var(--search-text);
  padding:0 10px; margin:0;
  box-sizing:border-box;
  font-size:16px;
  display:flex; align-items:center;
}
.search-clear{
  height:100%; width:var(--row-h); min-width:var(--row-h);
  flex-shrink:0;
  background:var(--bg-day); border:none; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--icon); font-size:22px;
  box-shadow: inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.2);
}

html[data-theme="dark"] .search-clear{ background:var(--bg-night); }
.h-btn{
  height:calc(var(--row-h) - 8px); min-width:var(--row-h);
  flex-shrink:0; background:var(--bg-day); border:none; border-radius:12px;
  display:flex; align-items:center; gap:6px; padding:0 8px;
  cursor:pointer; box-shadow: inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.2);
}
html[data-theme="dark"] .h-btn{ background:var(--bg-night); }
.h-img{ width:28px; height:28px; border-radius:50%; object-fit:cover; }
.h-texts{ display:flex; flex-direction:column; align-items:flex-start; line-height:1; }
.h-label{ font-size:12px; color:var(--icon); font-weight:bold; }
.h-role{ font-size:9px; color:var(--icon); opacity:.7; }
.h-img{ 
  width:28px; height:28px; 
  font-size:28px; 
  display:flex; align-items:center; justify-content:center; 
  border-radius:50%;
  background:var(--bg-day); 
  color:var(--icon);
}
html[data-theme="dark"] .h-img{ background:var(--bg-night); }


/* ===================တူးဘားတန်း ============== */
.toolbar-row{ 
  width:100vw; height:var(--row-h); background:var(--bg); display:flex; align-items:stretch; justify-content:space-evenly; position:fixed; left:0; right:0; bottom:0; border-top:1px solid #333; z-index:900; }
.t-btn{ 
  height:100%; width:var(--row-h); min-width:var(--row-h); flex-shrink:0; background:var(--bg-day); border:none; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; box-shadow: inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.2); }
html[data-theme="dark"] 
.t-btn{ 
  background:var(--bg-night); }
.t-btn .material-icons{ 
  font-size:22px; color:var(--icon); }
.t-label{ 
  font-size:9px; background:#ffcdd2; color:#111; padding:1px 4px; border-radius:6px; margin-top:2px; display:none; }
@media (min-width:600px){ 
  .t-label{ display:block; } }
  
/* .more-popup{ 
  position:fixed; background:#2a2a2a; border:1px solid #444; border-radius:14px; padding:6px; min-width:170px; max-height:70vh; overflow:visible; display:none; flex-direction:column; gap:2px; box-shadow:0 10px 30px rgba(0,0,0,.6); z-index:999; } */
.more-popup{ 
  position:fixed; background:var(--bg-day); border:1px solid #444; border-radius:14px; padding:6px; min-width:170px; max-height:70vh; overflow:visible; display:none; flex-direction:column; gap:2px; box-shadow:0 10px 30px rgba(0,0,0,.6); z-index:999; }
html[data-theme="dark"] .more-popup{ background:var(--bg-night); }

.more-popup.show{ 
  display:flex; }
/*.more-item{ 
  padding:11px 12px; border-radius:10px; color:#ccc; display:flex; align-items:center; justify-content:space-between; white-space:nowrap; cursor:pointer; position:relative; }*/
.more-item{ 
  padding:11px 12px; border-radius:10px; color:var(--icon); display:flex; align-items:center; justify-content:space-between; white-space:nowrap; cursor:pointer; position:relative; }

/*.more-item:hover{ 
  background:#3a3a3a; color:#fff; } */
/*
.more-item .submenu{ 
  position:absolute; left:calc(100% + 8px); top:0; background:#2a2a2a; border:1px solid #444; border-radius:14px; padding:6px; min-width:150px; display:none; flex-direction:column; gap:2px; z-index:1000; }*/
  
.more-item:hover{ 
  background:var(--toolbar-bg-day); color:var(--icon); }
html[data-theme="dark"] .more-item:hover{ background:#3a3a3a; color:#fff; }

.more-item .submenu{ 
  position:absolute; left:calc(100% + 8px); top:0; background:var(--bg-day); border:1px solid #444; border-radius:14px; padding:6px; min-width:150px; display:none; flex-direction:column; gap:2px; z-index:1000; }
html[data-theme="dark"] .more-item .submenu{ background:var(--bg-night); }

.more-item .submenu.show{ display:flex; }
#toast{ 
  position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(20px); background:#333; color:#fff; padding:10px 16px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9999; }
#toast.show{ 
  opacity:1; transform:translateX(-50%) translateY(0); }

  display:flex; align-items:center; gap:6px;
  padding:0 14px; height:40px; border-radius:999px;

}
body.night .btn-12{ background:#2a2a2a; border-color:#444; color:#fff; } klw*/

</style>
</head>
<body>
  <!-- ခေါင်းစည်းတန်း -->
<div class="header-row" id="headerRow">
  <div class="header-left">
  <!-- layout 1 -->
<div id="headerTitle" class="header-layout layout1">
  <div class="header-wrapper">
    <img src="https://media.tenor.com/_EreiMKqzs4AAAAj/arakan-flag-rakhine-flag.gif" class="nav-flag" alt="Flag">
<div class="brand-container">
  <div class="scrolling-text">
    <span class="nav-text-item">Arakan Art Area</span>
<span class="nav-text-item">အာရက္ခ အနုပညာ နယ်မြီ</span>
<span class="nav-text-item">ရခိုင် အနုပညာ နယ်မြေ</span>
<span class="nav-text-item">All Arakan Assets</span>

  </div>
</div>
    <img src="https://media.tenor.com/_EreiMKqzs4AAAAj/arakan-flag-rakhine-flag.gif" class="nav-flag" alt="Flag">
  </div>
</div>
  <!-- layout 2 -->
  <div id="headerSearch" class="header-layout layout2 hidden">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="ရှာမယ်...">
<button id="searchClear" class="search-clear"><span class="material-icons">close</span></button>
    </div>
  </div>
</div>
  <button class="h-btn" id="headerAccountBtn">
<span class="material-icons h-img">person</span>
    <div class="h-texts">
      <span class="h-label">Login</span>
      <span class="h-role">Viewer</span>
    </div>
  </button>
</div>

  <!-- တူးဘားတန်း -->
<div class="toolbar-row" id="toolbarRow"></div>
<div class="more-popup" id="morePopup"></div>
<div id="toast"></div>

<script>
let currentThemeMode = localStorage.getItem('themeMode') || 'auto';

const ACCOUNT = { 
  guest:{icon:'person', label:'Login', role:'Viewer'}, user:{img:'profile.jpg', label:'Myo', role:'Admin'} }
const BUTTONS = [
  {id:'home', icon:'home', label:'Home'}, {id:'search', icon:'search', label:'Search'},
  {id:'fav', icon:'favorite', label:'Fav'}, {id:'settings', icon:'settings', label:'Settings'},
  {id:'person', icon:'person', label:'Profile'}, {id:'mail', icon:'mail', label:'Mail'},
  {id:'notif', icon:'notifications', label:'Noti'}, {id:'more1', icon:'star', label:'Star'}, {id:'more2', icon:'info', label:'Info'},
];
const SETTINGS_MENU = [
  { id:'login', icon:'login', label:'Login' },
  { id:'theme', icon:'palette', label:'Theme', children:[ {id:'light', label:'နေ့'}, {id:'dark', label:'ည'}, {id:'auto', label:'အော်တို'} ]},
  { id:'sort', icon:'sort', label:'Sort', children:[ {id:'az', label:'A-Z'}, {id:'za', label:'Z-A'}, {id:'old', label:'Old Time'}, {id:'new', label:'New Time'} ]},
  { id:'mode', icon:'view_module', label:'Mode' },
];
const row=document.getElementById('toolbarRow');
const popup=document.getElementById('morePopup');
let lastAnchor=null;
function toast(msg){ 
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2000); }
function closePopup(){ 
  popup.classList.remove('show'); popup.style.visibility=''; popup.style.left=''; popup.style.top=''; document.querySelectorAll('.submenu.show').forEach(s=>s.classList.remove('show')); lastAnchor=null; }
function positionMenu(menu, anchorBtn){
  menu.classList.add('show'); menu.style.visibility='hidden'; menu.style.left='0px'; menu.style.top='0px';
  requestAnimationFrame(()=>{
    const btnRect=anchorBtn.getBoundingClientRect(); const menuRect=menu.getBoundingClientRect();
    const toolbarTop=row.getBoundingClientRect().top; const m=8;
    let left=btnRect.right - menuRect.width; let top=btnRect.top - menuRect.height - m;
    if(left + menuRect.width > window.innerWidth - m) left=window.innerWidth - menuRect.width - m;
    if(left < m) left=m;
    if(top + menuRect.height > toolbarTop - m) top=toolbarTop - menuRect.height - m;
    if(top < m) top=m;
    menu.style.left=left+'px'; menu.style.top=top+'px'; menu.style.visibility='visible';
  });
}
function toggleSub(item){
  const sub=item.querySelector('.submenu'); if(!sub) return;
  const isShow=sub.classList.contains('show');
  item.parentElement.querySelectorAll('.submenu').forEach(s=>{ if(s!==sub) s.classList.remove('show'); });
  if(isShow){ sub.classList.remove('show'); return; }
  sub.classList.add('show');
  requestAnimationFrame(()=>{
    sub.style.left=''; sub.style.right=''; sub.style.top=''; sub.style.bottom='';
    const r=sub.getBoundingClientRect(); const m=8;
    if(r.right > window.innerWidth - m){ sub.style.left='auto'; sub.style.right='calc(100% + 8px)'; }
    if(r.bottom > window.innerHeight - m){ sub.style.top='auto'; sub.style.bottom='0'; }
  });
}
function openMenuAt(anchorBtn, menuData){
  const isSame=lastAnchor===anchorBtn && popup.classList.contains('show');
  if(isSame){ closePopup(); return; }
  closePopup(); lastAnchor=anchorBtn; popup.innerHTML='';
  menuData.forEach(item=>{
    const div=document.createElement('div'); div.className='more-item';
    div.innerHTML=`<span style="display:flex;gap:8px;align-items:center"><span class="material-icons" style="font-size:18px">${item.icon||'circle'}</span>${item.label}</span> ${item.children ? '<span class="material-icons" style="font-size:16px">chevron_right</span>' : ''}`;
    if(item.children){
      const sub=document.createElement('div'); sub.className='submenu';
      /*item.children.forEach(ch=>{ const s=document.createElement('div'); s.className='more-item'; s.textContent=ch.label; s.onclick=(e)=>{ e.stopPropagation(); toast(ch.label); closePopup(); }; sub.appendChild(s); });*/
      
      item.children.forEach(ch=>{ 
  const s=document.createElement('div'); s.className='more-item'; s.textContent=ch.label; 
  s.onclick = (e) => {
  e.stopPropagation();
  if (['light', 'dark', 'auto'].includes(ch.id)) {
    applyTheme(ch.id);
  }
  toast(ch.label);
  closePopup();
};
  sub.appendChild(s); 
});
      div.appendChild(sub); div.onclick=(e)=>{ e.stopPropagation(); toggleSub(div); };
    }else{ div.onclick=(e)=>{ e.stopPropagation(); toast(item.label); closePopup(); }; }
    popup.appendChild(div);
  });
  popup.classList.add('show'); positionMenu(popup, anchorBtn);
}
function openMoreMenu(anchorBtn, hiddenButtons){
  const isSame=lastAnchor===anchorBtn && popup.classList.contains('show');
  if(isSame){ closePopup(); return; }
  closePopup(); lastAnchor=anchorBtn; popup.innerHTML='';
  hiddenButtons.forEach(b=>{
    const m=document.createElement('div'); m.className='more-item';
    m.innerHTML=`<span style="display:flex;gap:8px;align-items:center"><span class="material-icons" style="font-size:18px">${b.icon}</span>${b.label}</span>`;
    m.onclick=(e)=>{ e.stopPropagation(); toast(b.label); closePopup(); };
    popup.appendChild(m);
  });
  popup.classList.add('show'); positionMenu(popup, anchorBtn);
}
function render(){
  row.querySelectorAll('.t-btn').forEach(b=>b.remove());
  popup.innerHTML=''; closePopup();
  const rowW=row.clientWidth; const btnW=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h')) || 56;
  const maxFit=Math.floor(rowW / btnW) - 1; let visible=BUTTONS; let hidden=[];
  if(BUTTONS.length * btnW > rowW){ visible=BUTTONS.slice(0, maxFit); hidden=BUTTONS.slice(maxFit); }
  /*
  visible.forEach(b=>{
    const btn=document.createElement('button'); btn.className='t-btn'; btn.id=b.id;
    btn.innerHTML=`<span class="material-icons">${b.icon}</span><span class="t-label">${b.label}</span>`;
    if(b.id==='settings'){ btn.onclick=(e)=>{ e.stopPropagation(); openMenuAt(btn, SETTINGS_MENU); }; }
    else{ btn.onclick=(e)=>{ e.stopPropagation(); toast(b.label); }; }
    row.appendChild(btn);
  });*/
  visible.forEach(b=>{
    const btn=document.createElement('button'); btn.className='t-btn'; btn.id=b.id;
    btn.innerHTML=`<span class="material-icons">${b.icon}</span><span class="t-label">${b.label}</span>`;
    if(b.id==='settings'){ btn.onclick=(e)=>{ e.stopPropagation(); openMenuAt(btn, SETTINGS_MENU); }; }
    else if(b.id==='search'){ btn.onclick=(e)=>{ e.stopPropagation(); showSearch(); }; }
    else{ btn.onclick=(e)=>{ e.stopPropagation(); toast(b.label); }; }
    row.appendChild(btn);
  });
  
  if(hidden.length>0){
    const moreBtn=document.createElement('button'); moreBtn.className='t-btn'; moreBtn.id='more-btn';
    moreBtn.innerHTML=`<span class="material-icons">more_horiz</span><span class="t-label">More</span>`;
    moreBtn.onclick=(e)=>{ e.stopPropagation(); openMoreMenu(moreBtn, hidden); };
    row.appendChild(moreBtn);
  }
}
const mq=window.matchMedia('(prefers-color-scheme: dark)');
/* 
function applyTheme(){ 
  document.documentElement.dataset.theme=mq.matches?'dark':'light'; } */
function applyTheme(mode = currentThemeMode) {
  currentThemeMode = mode;
  localStorage.setItem('themeMode', mode);
  if (mode === 'auto') {
    document.documentElement.dataset.theme = mq.matches ? 'dark' : 'light';
  } else {
    document.documentElement.dataset.theme = mode;
  }
}

/* mq.addEventListener('change', applyTheme); applyTheme();*/
mq.addEventListener('change', () => { if (currentThemeMode === 'auto') applyTheme('auto'); });
applyTheme(currentThemeMode);
new ResizeObserver(()=>render()).observe(row);
document.addEventListener('click',(e)=>{ if(!e.target.closest('#morePopup') && !e.target.closest('#toolbarRow')) closePopup(); });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closePopup(); });
render();
// search toggle
const titleEl = document.getElementById('headerTitle');
const searchEl = document.getElementById('headerSearch');
function showSearch(){ 
  const isHidden = searchEl.classList.contains('hidden');
  if(isHidden){
    titleEl.classList.add('hidden'); searchEl.classList.remove('hidden'); 
    document.getElementById('searchInput').focus();
  } else {
    hideSearch();
  }
}
function hideSearch(){ 
  searchEl.classList.add('hidden'); titleEl.classList.remove('hidden'); 
}
// bottom toolbar က search ခလုတ်နဲ့ ထိန်းမယ်
// BUTTONS ထဲက search ကို နှိပ်ရင်
document.addEventListener('click', (e)=>{
  if(e.target.closest('#search')) showSearch();
});
document.getElementById('searchClear').onclick = ()=>{
  document.getElementById('searchInput').value = '';
  document.getElementById('searchInput').focus();
};
</script>
</body>
</html>

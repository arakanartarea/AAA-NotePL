<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Studio - ArakanArtArea</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Myanmar:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e11;color:#fff;font-family:Inter,'Noto Sans Myanmar',sans-serif}
.my{font-family:'Noto Sans Myanmar',sans-serif}
.top{max-width:980px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;gap:10px;align-items:center}
.logo-b{width:34px;height:34px;border-radius:50%;background:#FFE066;color:#000;display:grid;place-items:center;font-weight:800}
.b1{font-size:12px;letter-spacing:.14em;font-weight:700}
.b2{font-size:11px;opacity:.45}
.btn{height:32px;padding:0 14px;border-radius:999px;background:#1e1e22;border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.7);cursor:pointer;font-size:12px}
.tabs{display:flex;justify-content:center;margin:8px 0 16px}
.twrap{display:flex;gap:4px;padding:4px;background:#1a1a1e;border:1px solid rgba(255,255,255,.06);border-radius:999px}
.t{padding:6px 16px;border-radius:999px;border:0;background:transparent;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer}
.t.on{background:#FFE066;color:#000;font-weight:600}
.wrap{max-width:980px;margin:0 auto;padding:0 12px 24px}
.card{background:#1a1a1e;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px}
.grid2{display:grid;grid-template-columns:220px 1fr;gap:18px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.ibox{aspect-ratio:16/10;background:#101012;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.ibox img{width:100%;height:100%;object-fit:cover}
.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600;margin-bottom:6px;display:block}
.inp{width:100%;height:40px;padding:0 12px;border-radius:10px;background:#101012;border:1px solid rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none}
.inp:focus{border-color:rgba(255,224,102,.4)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.cus{display:flex;gap:8px;margin-bottom:8px}
.btn2{height:36px;padding:0 16px;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:13px}
.white{background:#fff;color:#000}
.ghost{background:#26262b;color:#fff;border:1px solid rgba(255,255,255,.08)}
.x{border:0;background:transparent;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;padding:0 6px}

/* STAGE EXACT RATIO - FIXED */
.stage-out{display:flex;justify-content:center}
.stage{position:relative;overflow:hidden;background:#08080a;border:1px solid rgba(255,255,255,.06);border-radius:12px;display:flex;justify-content:center;align-items:center}
.stage.r9-16{width:min(400px,92vw);aspect-ratio:9/16;max-height:780px}
.stage.r16-9{width:100%;aspect-ratio:16/9;max-width:900px}
.bg{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(24px) brightness(.52) saturate(1.1)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 60%,rgba(0,0,0,.6) 100%)}
.glass{position:relative;z-index:2;width:86%;height:90%;border:1px solid rgba(255,255,255,.14);background:rgba(22,22,26,.52);backdrop-filter:blur(14px);border-radius:4px;padding:12px;display:flex;flex-direction:column;overflow:hidden}
.stage.r16-9.glass{width:92%;height:86%}
.corner{position:absolute;width:18px;height:18px;border-color:#FFD60A;border-style:solid}
.tl{top:0;left:0;border-width:2px 0 0 2px;border-top-left-radius:4px}
.tr{top:0;right:0;border-width:2px 2px 0 0;border-top-right-radius:4px}
.bl{bottom:0;left:0;border-width:0 0 2px 2px;border-bottom-left-radius:4px}
.br{bottom:0;right:0;border-width:0 2px 2px 0;border-bottom-right-radius:4px}

.channel{
  position:relative;
  text-align:center;
  font-size:18px;
  letter-spacing:.22em;
  font-weight:800;
  color:#FFE066;
  padding:5px 3px;
  border-radius:999px;
  border:1px solid rgba(255,214,10,.25);
  overflow:hidden;
  background:rgba(0,0,0,.4);
  isolation:isolate;
}
.channel::before{
  content:"";
  position:absolute;
  inset:-12px;
  z-index:-1;
  background:
    radial-gradient(60% 80% at 25% 50%, rgba(255,40,40,.65) 0%, transparent 60%),
    radial-gradient(60% 80% at 75% 50%, rgba(40,90,255,.7) 0%, transparent 60%),
    radial-gradient(40% 60% at 50% 20%, rgba(255,255,255,.15) 0%, transparent 70%);
  filter:blur(10px) saturate(1.2);
  opacity:.95;
}
/* === FIX: Image control === */
.layout-v{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.imgw-v{flex:0 0 auto;max-height:38%;border-radius:10px;overflow:hidden;border:1.5px solid rgba(255,214,10,.7);background:#000}
.imgw-v img{width:100%;height:100%;max-height:180px;object-fit:cover;display:block}
.title-v{flex:0 0 auto;color:#FFE066;font-weight:700;font-style:italic;font-size:clamp(18px,5.5vw,28px);text-align:center;line-height:1.15;text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 16px rgba(255,224,102,.35)}

.layout-h{flex:1;min-height:0;display:flex;gap:12px;overflow:hidden}
.left{width:46%;display:flex;flex-direction:column;gap:8px;min-width:0;flex-shrink:0}
.imgw-h{flex:0 0 auto;max-height:68%;border-radius:10px;overflow:hidden;border:1.5px solid rgba(255,214,10,.7);background:#000}
.imgw-h img{width:100%;height:auto;max-height:160px;object-fit:cover;display:block}
.title-h{flex:0 0 auto;color:#FFE066;font-weight:700;font-style:italic;font-size:clamp(14px,2vw,24px);line-height:1.15;text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.right{width:54%;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}

.det{list-style:none;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.stage.r16-9.det{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}
.d{display:flex;gap:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:8px;padding:6px 9px;min-height:32px}
.dot{width:5px;height:5px;border-radius:50%;background:#FFD60A;margin-top:7px;flex-shrink:0}
.dl{font-size:10px;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.45);white-space:nowrap}
.dv{font-size:12px;font-weight:500;color:#f5f5f5;word-break:break-word}

.video .imgw-v,.video.imgw-h{animation:zoom.7s cubic-bezier(.175,.885,.32,1.275) forwards.2s;opacity:0}
.video .title-v,.video.title-h{animation:up.5s ease forwards.8s;opacity:0}
.video .d{opacity:0;animation:left.4s ease forwards}
@keyframes zoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes left{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><div class="logo-b">AAA</div><div><div class="b1">COVER STUDIO • ARAKANARTAREA</div><div class="b2 my">အာရက္ခ အနုပညာ ရပ်ဝန်း</div></div></div><button class="btn" id="btnAspect">9:16</button></div>
<div class="tabs"><div class="twrap"><button class="t on" data-tab="input">1. Data Input</button><button class="t" data-tab="image">2. View Image</button><button class="t" data-tab="video">3. View Video</button></div></div>
<div class="wrap">
<div id="pInput" class="card"><div class="grid2"><div><span class="lab">Cover Image / မူရင်း Video ပုံ</span><div class="ibox" id="boxImg"><img id="iCover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=800&auto=format&fit=crop"></div><input type="file" id="fCover" accept="image/*" hidden><div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:6px">ပုံကြီးနေရင် auto ထိန်းချုပ်ပြီး ဖြစ်မယ်</div></div><div><div class="fgrid" id="fgrid"></div><div style="margin-top:12px;padding:10px;border:1px dashed rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.02)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="lab" style="margin:0">Add Input</span><button class="btn2 ghost" id="btnAdd" style="height:28px;font-size:12px">+ Add Input</button></div><div id="clist"></div></div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn2 white" id="toImg">View Preview →</button></div></div></div></div>

<div id="pPrev" style="display:none">
  <div class="stage-out"><div id="stage" class="stage r9-16"><div id="bg" class="bg"></div><div class="vig"></div><div class="glass"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <div class="channel my">★ Arakan Art Area ★</div>
<div id="layV" class="layout-v"><div class="imgw-v"><img id="oImgV" src=""></div><div id="oTitleV" class="title-v my">—</div><ul id="oDetV" class="det"></ul></div>
<div id="layH" class="layout-h" style="display:none"><div class="left"><div class="imgw-h"><img id="oImgH" src=""></div><div id="oTitleH" class="title-h my">—</div></div><div class="right"><ul id="oDetH" class="det"></ul></div></div>
</div></div></div><div style="display:flex;justify-content:center;gap:10px;margin-top:10px"><button class="btn2 ghost" id="btnReplay" style="display:none">↻ Replay 5s</button><span style="font-size:11px;color:rgba(255,255,255,.25);align-self:center">အချက်အလက်အကုန် အချိုးထဲဝင်မယ် • Blur + Glass ထိန်းပြီး</span></div></div>
</div>
<script>
const defaults=[
  {k:'title',label:'Song Title (သီချင်းခေါင်းစဉ်)',v:'AAA',full:true},
  {k: 'composer', label: 'Composer', v: '' },
// {k: 'writer', label: 'Writer / စာသားရေး', v: '' },
  {k:'artist',label:'Artist',v:''},
  {k:'version',label:'Version',v:''},
  {k:'key',label:'Key',v:'key'},
  {k:'capo',label:'Capo',v:'0rd Fret (K Key Shape)'},
  {k:'tempo',label:'Tempo',v:'0 BPM'},
];
let fields=JSON.parse(JSON.stringify(defaults));
let customs=[];
let cover=document.getElementById('iCover').src;
let isLand=false;
let tab='input';
const fgrid=document.getElementById('fgrid');
const clist=document.getElementById('clist');
function renderF(){
  fgrid.innerHTML='';
  fields.forEach(f=>{
    const d=document.createElement('div'); d.className=f.full?'full':''; d.innerHTML=`<label class="lab">${f.label}</label><input class="inp" data-k="${f.k}" value="${f.v}">`; fgrid.appendChild(d);
  });
  fgrid.querySelectorAll('.inp').forEach(i=>{ i.oninput=e=>{ const o=fields.find(x=>x.k===e.target.dataset.k); if(o) o.v=e.target.value; upd(); }; });
  renderC();
}
function renderC(){
  clist.innerHTML='';
  customs.forEach((c,i)=>{
    const r=document.createElement('div'); r.className='cus'; r.innerHTML=`<input class="inp" placeholder="Label" value="${c.label}" data-i="${i}" data-t="label" style="flex:.8"><input class="inp" placeholder="Value" value="${c.value}" data-i="${i}" data-t="value" style="flex:1"><button class="x" data-d="${i}">×</button>`; clist.appendChild(r);
  });
  clist.querySelectorAll('input').forEach(inp=>{ inp.oninput=e=>{ customs[e.target.dataset.i][e.target.dataset.t]=e.target.value; upd(); }; });
  clist.querySelectorAll('[data-d]').forEach(b=>{ b.onclick=e=>{ customs.splice(e.target.dataset.d,1); renderC(); upd(); } });
}
document.getElementById('btnAdd').onclick=()=>{ 
  customs.push({label:'New',value:''}); renderC(); upd(); };
function upd(){
  const title=fields.find(f=>f.k==='title')?.v||'—';
  document.getElementById('oTitleV').textContent=title;
  document.getElementById('oTitleH').textContent=title;
  document.getElementById('oImgV').src=cover;
  document.getElementById('oImgH').src=cover;
  document.getElementById('bg').style.backgroundImage=`url(${cover})`;
  const all=[...fields.filter(f=>f.k!=='title'),...customs];
  ['oDetV','oDetH'].forEach(id=>{
    const ul=document.getElementById(id); ul.innerHTML='';
    all.forEach((f,i)=>{
      const label=f.label||f.k; const val=f.v||f.value||'—';
      const li=document.createElement('li'); li.className='d'; li.style.animationDelay=(1.1+i*0.22)+'s';
      li.innerHTML=`<span class="dot"></span><span><span class="dl">${label}</span><span style="margin:0 5px;opacity:.2">:</span><span class="dv">${val}</span></span>`;
      ul.appendChild(li);
    });
  });
}
document.getElementById('boxImg').onclick=()=>document.getElementById('fCover').click();
document.getElementById('fCover').onchange=e=>{ const file=e.target.files[0]; if(!file) return; cover=URL.createObjectURL(file); document.getElementById('iCover').src=cover; upd(); };
document.querySelectorAll('.t').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.t').forEach(x=>x.classList.remove('on')); t.classList.add('on'); tab=t.dataset.tab;
    const input=document.getElementById('pInput'); const prev=document.getElementById('pPrev'); const rep=document.getElementById('btnReplay'); const stage=document.getElementById('stage');
    if(tab==='input'){ input.style.display='block'; prev.style.display='none'; }
    else{ input.style.display='none'; prev.style.display='block'; const isVideo=tab==='video'; rep.style.display=isVideo?'inline-flex':'none'; stage.classList.toggle('video',isVideo); if(isVideo) replay(); }
  };
});
document.getElementById('toImg').onclick=()=>document.querySelector('[data-tab="image"]').click();
document.getElementById('btnAspect').onclick=()=>{
  isLand=!isLand;
  document.getElementById('btnAspect').textContent=isLand?'16:9':'9:16';
  const stage=document.getElementById('stage'); stage.className='stage '+(isLand?'r16-9':'r9-16')+(tab==='video'?' video':'');
  document.getElementById('layV').style.display=isLand?'none':'flex';
  document.getElementById('layH').style.display=isLand?'flex':'none';
};
function replay(){
  const s=document.getElementById('stage'); s.classList.remove('video'); void s.offsetWidth; s.classList.add('video'); }
document.getElementById('btnReplay').onclick=replay;
document.getElementById('layV').style.display='flex'; document.getElementById('layH').style.display='none';
renderF(); upd();
</script>
</body>
</html>

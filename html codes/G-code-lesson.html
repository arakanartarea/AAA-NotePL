<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
:root{ 
 --row-h: 
  clamp(44px, 10vw, 56px); 
 --bg-day:#e3f2fd; 
 --bg-night:#2a2a2a; 
 --toolbar-bg-day:#e3f2fd; 
 --toolbar-bg-night:#1a1a1a; 
 --search-box-day:#fff; --search-text-day:#111; --search-border-day:#888;
 --search-box-night:#2a2a2a; --search-text-night:#fff; --search-border-night:#555;
}
 
html[data-theme="light"]{ 
  --bg:var(--toolbar-bg-day); --icon:#111; }
html[data-theme="dark"]{ 
  --bg:var(--toolbar-bg-night); --icon:#fff; }
html[data-theme="light"]{ 
  --search-box:var(--search-box-day); --search-text:var(--search-text-day); --search-border:var(--search-border-day); }
html[data-theme="dark"]{ 
  --search-box:var(--search-box-night); --search-text:var(--search-text-night); --search-border:var(--search-border-night); }

*{box-sizing:border-box;margin:0;padding:0}

.header-row{
  width:100%; height:var(--row-h);
  position:fixed; top:0; left:0; right:0;
  background:var(--bg-day); border-bottom:1px solid #333;
  display:flex; align-items:stretch; /* center ကနေ stretch */
  justify-content:space-between;
  padding:0; z-index:900; box-sizing:border-box;
}
html[data-theme="dark"] .header-row{ background:var(--bg-night); }

.header-left{ 
  flex:1; min-width:0; height:100%; display:flex; align-items:stretch; overflow:hidden; padding:0; margin:0; }

/* layout 1,2 ဘာအရွယ်မှ မပေး - အပြည့်ယူခိုင်း */
.header-layout{ width:100%; height:100%; display:flex; align-items:stretch; }
.header-layout.hidden{ display:none !important; }
.layout1{ background:var(--bg-day); padding:0; }
html[data-theme="dark"] .layout1{ background:var(--bg-night); }

.header-wrapper{ 
  width:100%; height:100%; 
  display:flex; align-items:center; justify-content:space-between; 
  gap:10px; 
  padding:0 10px; /* ဘယ်ညာ 10px ချန် */
  box-sizing:border-box; 
}
.nav-flag{ width:28px; height:28px; flex-shrink:0; }

.brand-container{ flex:1; height:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.scrolling-text{
  display:flex; flex-direction:column; align-items:center;
  animation: scrollUp 6s linear infinite;
}
.nav-text-item{
  height:var(--row-h); display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:16px; letter-spacing:0.5px;
  /* ၃ ရောင် ရောထားတဲ့ gradient text */
  background: linear-gradient(90deg, #2e7bff 0%, #ffffff 50%, #ff2e2e 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  /* လှအောင် glow */
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  animation: shine 3s linear infinite;
}
html[data-theme="light"] .nav-text-item{
  background: linear-gradient(90deg, #0a3d9c 0%, #111 50%, #b80000 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:none;
}
@keyframes shine{
  0%{ background-position:0% 50%; }
  100%{ background-position:200% 50%; }
}
@keyframes scrollUp{
  0%{ transform:translateY(75%); }
  100%{ transform:translateY(-75%); }
}


/* ရှာဖွေရေး */
.search-box{
  width:100%; height:100%;
  display:flex; align-items:stretch;
  background:var(--search-box); 
  border:none; /* border အသေ ဖြုတ် */
  border-radius:0;
  box-sizing:border-box;
  overflow:hidden;
}
#searchInput{
  flex:1; height:100%; width:100%;
  border:none; outline:none; border-radius:0; /* အသေ ဖြုတ် */
  background:transparent; color:var(--search-text);
  padding:0 10px; margin:0;
  box-sizing:border-box;
  font-size:16px;
  display:flex; align-items:center;
}
.search-clear{
  height:100%; width:var(--row-h); min-width:var(--row-h);
  flex-shrink:0;
  background:var(--bg-day); border:none; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--icon); font-size:22px;
  box-shadow: inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.2);
}
html[data-theme="dark"] .search-clear{ background:var(--bg-night); }

.h-btn{
  height:calc(var(--row-h) - 8px); min-width:var(--row-h);
  flex-shrink:0; background:var(--bg-day); border:none; border-radius:12px;
  display:flex; align-items:center; gap:6px; padding:0 8px;
  cursor:pointer; box-shadow: inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.2);
}
html[data-theme="dark"] .h-btn{ background:var(--bg-night); }

.h-img{ 
  width:28px; height:28px; flex-shrink:0; border-radius:50%; 
  display:flex; align-items:center; justify-content:center; 
  font-size:22px; background:var(--bg-day); color:var(--icon);
  border:1px solid #888;
}
html[data-theme="dark"] .h-img{
  background:var(--bg-night);
  color:#fff;
  border-color:#aaa;
}
html[data-theme="dark"] .h-img.img-mode{
  background:transparent;
  border-color:#fff;
}
img.h-img{
  display:block; padding:0; object-fit:cover; 
  width:28px; height:28px; /* အဝိုင်းသေး */
  border:1.5px solid var(--icon);
}
.h-img.img-mode{ 
  background:transparent; }
.h-texts{ 
  display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; overflow:hidden; max-width:90px; }
.h-label{ 
  font-size:12px; color:var(--icon); font-weight:bold; white-space:nowrap; width:100%; overflow:hidden; }
.h-role{ font-size:9px; color:var(--icon); opacity:.7; white-space:nowrap; }
.marquee{ width:75px; overflow:hidden; white-space:nowrap; }
.marquee-track{ display:inline-flex; animation: scrollLoop 8s linear infinite; }
.marquee-track span{ 
  white-space:nowrap; padding-right:15px; font-size:12px; font-weight:bold; color:var(--icon); }
@keyframes scrollLoop{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-50%); }
}


/* ===================တူးဘားတန်း ============== */
.toolbar-row{ 
  width:100vw; height:var(--row-h); background:var(--bg); display:flex; align-items:stretch; justify-content:space-evenly; position:fixed; left:0; right:0; bottom:0; border-top:1px solid #333; z-index:900; }
.t-btn{ 
  height:100%; width:var(--row-h); min-width:var(--row-h); flex-shrink:0; background:var(--bg-day); border:none; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; box-shadow: inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.2); }
html[data-theme="dark"] 
.t-btn{ 
  background:var(--bg-night); }
.t-btn .material-icons{ 
  font-size:22px; color:var(--icon); }
.t-label{ 
  font-size:9px; background:#ffcdd2; color:#111; padding:1px 4px; border-radius:6px; margin-top:2px; display:none; }
@media (min-width:600px){ 
  .t-label{ display:block; } }

html[data-theme="dark"] .more-popup{ background:var(--bg-night); }

.more-popup.show{ 
  display:flex; }

.more-item{

.more-item:hover{ 
  background:var(--toolbar-bg-day); color:var(--icon); }
html[data-theme="dark"] .more-item:hover{ background:#3a3a3a; color:#fff; }

.more-item .submenu{ 
  position:absolute; left:calc(100% + 8px); top:0; 
  background:var(--bg-day); border:1px solid #444; border-radius:14px; 
  padding:6px; min-width:150px; 
  max-height: 300px; /* 7-10 ခုစာ - ဒါက အသစ် */
  overflow-y: auto; overflow-x: hidden; /* ဒါက အသစ် */
  display:none; flex-direction:column; gap:2px; z-index:1000; 
}
html[data-theme="dark"] .more-item .submenu{ background:var(--bg-night); }

.more-item .submenu.show{ display:flex; }

/* မစ်ဆေ့ပြ */
#toast{ 
  position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(20px); background:#333; color:#fff; padding:10px 16px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9999; }
#toast.show{ 
  opacity:1; transform:translateX(-50%) translateY(0); }

const row=document.getElementById('toolbarRow');

function toast(msg){ 
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2000); }
function closePopup(){ 
  popup.classList.remove('show'); popup.style.visibility=''; popup.style.left=''; popup.style.top=''; document.querySelectorAll('.submenu.show').forEach(s=>s.classList.remove('show')); lastAnchor=null; }
function positionMenu(menu, anchorBtn){
  menu.classList.add('show'); menu.style.visibility='hidden'; menu.style.left='0px'; menu.style.top='0px';
  requestAnimationFrame(()=>{
    const btnRect=anchorBtn.getBoundingClientRect(); const menuRect=menu.getBoundingClientRect();
    const toolbarTop=row.getBoundingClientRect().top; const m=8;
    let left=btnRect.right - menuRect.width; let top=btnRect.top - menuRect.height - m;
    if(left + menuRect.width > window.innerWidth - m) left=window.innerWidth - menuRect.width - m;
    if(left < m) left=m;
    if(top + menuRect.height > toolbarTop - m) top=toolbarTop - menuRect.height - m;
    if(top < m) top=m;
    menu.style.left=left+'px'; menu.style.top=top+'px'; menu.style.visibility='visible';
  });
}
function toggleSub(item){
  const sub=item.querySelector('.submenu'); if(!sub) return;
  const isShow=sub.classList.contains('show');
  item.parentElement.querySelectorAll('.submenu').forEach(s=>{ if(s!==sub) s.classList.remove('show'); });
  if(isShow){ sub.classList.remove('show'); return; }
  sub.classList.add('show');
  requestAnimationFrame(()=>{
    sub.style.left=''; sub.style.right=''; sub.style.top=''; sub.style.bottom='';
    const r=sub.getBoundingClientRect(); const m=8;
    if(r.right > window.innerWidth - m){ sub.style.left='auto'; sub.style.right='calc(100% + 8px)'; }
    if(r.bottom > window.innerHeight - m){ sub.style.top='auto'; sub.style.bottom='0'; }
  });
}

  popup.classList.add('show'); positionMenu(popup, anchorBtn);
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC7N9_TNTp_aThC_olEDyMcEo2pAhOFEGI",
    authDomain: "arakanese-dictionary.firebaseapp.com",
    projectId: "arakanese-dictionary",
    storageBucket: "arakanese-dictionary.firebasestorage.app",
    messagingSenderId: "955711906003",
    appId: "1:955711906003:web:6d9b60bd4cdaa8a8953426"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' }); // အကောင့်ရွေးခိုင်းဖို့ အရေးကြီး

const headerBtn = document.getElementById('headerAccountBtn');
let isLoggingOut = false;

function updateHeaderUI(userData) {
  if (userData) {
    const name = userData.Name;
    const needScroll = name.length > 9;
    headerBtn.innerHTML = `
      <img class="h-img img-mode" src="${userData.ProfileImage}" alt="p">
      <div class="h-texts">
        ${needScroll ? `
        <div class="marquee"><div class="marquee-track">
          <span>${name} &nbsp;🔓&nbsp; </span><span>${name} &nbsp;🔓&nbsp; </span>
        </div></div>` : `<span class="h-label">${name}</span>`}
        <span class="h-role">${userData.Role}</span>
      </div>`;
    localStorage.setItem('aaaUser', JSON.stringify(userData));
  } else {
    headerBtn.innerHTML = `<span class="material-icons h-img">person</span><div class="h-texts"><span class="h-label">Login</span><span class="h-role">Viewer</span></div>`;
    localStorage.removeItem('aaaUser');
  }
}

async function handleLoginFlow(){
  try{
    isLoggingOut = false;
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    const userRef = doc(db, "AllUserList", user.uid);
    const snap = await getDoc(userRef);
    let data;
    if(snap.exists()){ data = snap.data(); }
    else {
      const now = new Date();
      data = { AID:`A-${Date.now().toString().slice(-7)}`, GID:user.uid, Name:user.displayName||"", Acc:user.email||"", ProfileImage:user.photoURL||"", Time:now.toISOString(), TimeMs:now.getTime(), Year:now.getFullYear().toString(), Month:String(now.getMonth()+1).padStart(2,'0'), Role:"Viewer", createdAt:serverTimestamp() };
      await setDoc(userRef, data);
    }
    updateHeaderUI(data);
    toast(`မင်္ဂလာပါ ${data.Name}`);
  }catch(e){ toast(e.message); }
}

window.doLogout = async () => {
  isLoggingOut = true;
  localStorage.removeItem('aaaUser');
  await signOut(auth);
  updateHeaderUI(null);
  toast("ထွက်ပြီးပါပြီ"); closePopup();
};

window.doSwitch = async () => {
  closePopup();
  isLoggingOut = true;
  localStorage.removeItem('aaaUser');
  await signOut(auth); // အဟောင်းကို အပြတ်ဖျက်မှ အသစ်ရွေးလို့ရ
  await handleLoginFlow();
};

window.doLogin = handleLoginFlow;

onAuthStateChanged(auth, async (user)=>{
  if(isLoggingOut){ return; } // logout လုပ်နေရင် auto ပြန်သွင်းတာပိတ်
  if(user){
    const snap = await getDoc(doc(db, "AllUserList", user.uid));
    if(snap.exists()) updateHeaderUI(snap.data());
  } else {
    updateHeaderUI(null);
  }
});

headerBtn.onclick = (e)=>{
  e.stopPropagation();
  const saved = localStorage.getItem('aaaUser');
  if(!saved){ handleLoginFlow(); }
  else { openMenuAt(headerBtn, [{id:'logout', icon:'logout', label:'ထွက်မယ်'}, {id:'switch', icon:'switch_account', label:'ပြောင်းမယ်'}]); }
};

const originalOpenMenuAt = window.openMenuAt || openMenuAt;
window.openMenuAt = function(anchorBtn, menuData){
  originalOpenMenuAt(anchorBtn, menuData);
  setTimeout(()=>{
    document.querySelectorAll('#morePopup .more-item').forEach(el=>{
      if(el.textContent.includes('Login')) el.onclick = (e)=>{ e.stopPropagation(); closePopup(); handleLoginFlow(); };
      if(el.textContent.includes('ထွက်မယ်')) el.onclick = window.doLogout;
      if(el.textContent.includes('ပြောင်းမယ်')) el.onclick = window.doSwitch;
    });
  },10);
};

const cached = localStorage.getItem('aaaUser');
if(cached) try{ updateHeaderUI(JSON.parse(cached)); }catch(e){}

  <a class="item"><span>◍</span><label>Explore</label></a>
  <a class="item"><span>◐</span><label>Profile</label></a>
</nav>
<style>
.bottom-nav{ display:flex; justify-content:space-around; background:#fff;
  border:1px solid #e6dbb3; border-radius:20px; padding:8px 6px; font-family:system-ui; }

.item label{ font-weight:600; }

  <button class="fab mini">↗</button>
  <button class="fab main">＋</button>
</div>
<style>
.fab-group{ display:flex; flex-direction:column; align-items:center; gap:12px; width:fit-content; }
.fab{ border-radius:50%; border:1px solid #e6dbb3; cursor:pointer; display:grid; place-items:center; box-shadow:0 8px 20px rgba(96,86,57,.15); }
.fab.mini{ width:44px; height:44px; background:#fff; color:#605639; }
.fab.main{ width:56px; height:56px; background:#605639; color:#e6dbb3; font-size:24px; }

  <div class="group"><button class="b">B</button><button class="i">I</button><button class="u">U</button></div>
  <div class="sep"></div>
  <div class="group"><button>≡</button><button>• ≡</button><button>\uD83D\uDD17</button></div>
</div>
<style>
.format-bar{ display:flex; align-items:center; gap:12px; padding:8px 12px; background:#fff; border:1px solid #e6dbb3; border-radius:12px; font-family:system-ui; }
.group{ display:flex; gap:4px; }
.group button{ min-width:32px; height:32px; border-radius:8px; border:0; background:#fdfbf0; color:#605639; cursor:pointer; }
.group button.b{ font-weight:800; } .group button.i{ font-style:italic; } .group button.u{ text-decoration:underline; }
.sep{ width:1px; height:20px; background:#e6dbb3; }

</nav>

.crumbs{ display:flex; align-items:center; gap:8px; padding:10px 14px; background:#fff; border:1px solid #e6dbb3; border-radius:12px; font-family:system-ui; font-size:13px; }
.crumbs a{ color:#9a8f6f; text-decoration:none; } .crumbs a:hover{ color:#605639; }

  <button class="sort">↕ Sort</button>
</div>
<style>
.search-bar{ display:flex; gap:8px; align-items:center; padding:8px; background:#fff; border:1px solid #e6dbb3; border-radius:14px; font-family:system-ui; }
.input-wrap{ display:flex; align-items:center; gap:8px; flex:1; background:#fdfbf0; border:1px solid #e6dbb3; border-radius:10px; padding:0 12px; height:38px; }
.input-wrap input{ border:0; outline:0; background:transparent; width:100%; font-size:14px; }
.filter,.sort{ height:38px; padding:0 14px; border-radius:10px; border:1px solid #e6dbb3; background:#fff; color:#605639; cursor:pointer; font-weight:600; font-size:13px; }
.filter{ background:#605639; color:#e6dbb3; border-color:#605639; }

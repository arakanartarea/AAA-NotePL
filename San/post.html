<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arakan Art Area</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Padauk', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Input Form Area */
        #input-section {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #000;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-view {
            background-color: #00bcd4;
            color: white;
        }

        .btn-clear {
            background-color: #f44336;
            color: white;
        }

        /* View Section (Hidden by default) */
        #view-section {
            display: none;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }

        .art-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #000;
        }

        /* Styling boxes to match the sample image */
        .box-yellow {
            border: 4px solid #ffeb3b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fff;
        }

        .box-red {
            border: 4px solid #f44336;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .title-text {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            /* Mimicking the cyan text with black outline in sample */
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
            color: #00ffff; 
            letter-spacing: 1px;
        }

        .content-text {
            font-size: 18px;
            line-height: 1.6;
            white-space: pre-wrap; /* preserves line breaks */
        }

        .image-container {
            text-align: center;
            margin-top: 10px;
        }

        .image-container img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

    <!-- INPUT SECTION -->
    <div id="input-section">
        <h1>Arakan Art Area</h1>
        
        <div class="form-group">
            <label for="titleInput">ခေါင်းစဉ် (Title)</label>
            <input type="text" id="titleInput" placeholder="ခေါင်းစဉ် ထည့်ပါ...">
        </div>

        <div class="form-group">
            <label for="imageInput">ပုံ (Image URL)</label>
            <input type="text" id="imageInput" placeholder="ပုံ Link ထည့်ပါ...">
        </div>

        <div class="form-group">
            <label for="contentInput">အကြောင်းအရာ (Content)</label>
            <textarea id="contentInput" placeholder="စာသား ထည့်ပါ..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn-view" onclick="showView()">View (Full)</button>
            <button class="btn-clear" onclick="clearData()">Clear</button>
        </div>
    </div>

    <!-- VIEW SECTION -->
    <div id="view-section">
        <div class="art-title" id="displayTitle">Arakan Art Area</div>
        
        <!-- Yellow Box (Content) -->
        <div class="box-yellow">
            <div class="content-text" id="displayContent"></div>
        </div>

        <!-- Red Box (Title) -->
        <div class="box-red">
            <div class="title-text" id="displaySubTitle"></div>
        </div>

        <!-- Image Box -->
        <div class="box-yellow image-container">
            <img id="displayImage" src="" alt="Uploaded Image" style="display: none;">
        </div>
    </div>

    <script>
        // Load saved data when page opens
        document.addEventListener('DOMContentLoaded', () => {
            const savedTitle = localStorage.getItem('artTitle');
            const savedImage = localStorage.getItem('artImage');
            const savedContent = localStorage.getItem('artContent');

            if (savedTitle) document.getElementById('titleInput').value = savedTitle;
            if (savedImage) document.getElementById('imageInput').value = savedImage;
            if (savedContent) document.getElementById('contentInput').value = savedContent;
        });

        function showView() {
            // Get values
            const title = document.getElementById('titleInput').value || "Arakan Art Area";
            const image = document.getElementById('imageInput').value;
            const content = document.getElementById('contentInput').value || "အကြောင်းအရာ မရှိပါ။";

            // Save to LocalStorage
            localStorage.setItem('artTitle', title);
            localStorage.setItem('artImage', image);
            localStorage.setItem('artContent', content);

            // Populate View
            document.getElementById('displayTitle').innerText = title;
            document.getElementById('displaySubTitle').innerText = title;
            document.getElementById('displayContent').innerText = content;

            const imgElement = document.getElementById('displayImage');
            if (image) {
                imgElement.src = image;
                imgElement.style.display = 'inline-block';
            } else {
                imgElement.style.display = 'none';
            }

            // Switch views
            document.getElementById('input-section').style.display = 'none';
            document.getElementById('view-section').style.display = 'block';

            // Push state for back button handling
            history.pushState({ view: 'full' }, '', '#view');
        }

        function clearData() {
            if(confirm("သိမ်းထားတဲ့ အချက်အလက်တွေကို ရှင်းမှာသေချာလား?")) {
                // Clear inputs
                document.getElementById('titleInput').value = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('contentInput').value = '';
                
                // Clear local storage
                localStorage.removeItem('artTitle');
                localStorage.removeItem('artImage');
                localStorage.removeItem('artContent');
                
                alert("ရှင်းလင်းပြီးပါပြီ။");
            }
        }

        // Handle Phone Back Button
        window.onpopstate = function(event) {
            // If we are in View mode, go back to Input mode
            if(document.getElementById('view-section').style.display === 'block') {
                document.getElementById('input-section').style.display = 'block';
                document.getElementById('view-section').style.display = 'none';
            }
        };
    </script>
</body>
</html>

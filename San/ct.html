<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<style>
  /* နောက်ခံလုံးဝမပါ - transparent */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

 .aaa-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 6px;
    /* နောက်ခံမထည့် - video ပေါ်တင်ရင် ဒီအတိုင်းပေါ်မယ် */
  }

  /* ပုံကို အဝိုင်းက ပါတ်ထားမယ် - ဘယ်ဖက်မှာ အသေ */
 .logo-circle {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    background: #000;
    padding: 3px;
  }
 .logo-circle::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #FFDD00, #FF0000, #0066CC, #FFDD00
    );
    animation: rotateRing 3s linear infinite;
    z-index: -1;
  }
 .logo-circle img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #000;
  }

  /* ညာဖက်မှာ ချန်နယ်အမည် - အရောင်လေးတွေနဲ့ အလှဆင် */
 .name-box {
    position: relative;
    width: 280px;
    height: 32px;
    overflow: hidden;
  }
 .name {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    font-family: 'Padauk', Arial, sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(100%);
    white-space: nowrap;
  }
 .name.active {
    animation: slideIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  }
 .name.out {
    animation: slideOut 0.5s ease-in forwards;
  }

  /* အရောင်စုံ */
 .name1 {
    background: linear-gradient(90deg, #fff, #FFDD00);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 10px rgba(255,221,0,0.3);
  }
 .name2 {
    background: linear-gradient(90deg, #FFDD00, #FF4444, #4488FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
 .name3 {
    color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,0.6);
  }

  @keyframes rotateRing { to { transform: rotate(360deg); } }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(100%) scale(0.9); filter:blur(8px); }
    to { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  @keyframes slideOut {
    from { opacity:1; transform:translateY(0); }
    to { opacity:0; transform:translateY(-100%); filter:blur(8px); }
  }
</style>
</head>
<body>

<div class="aaa-wrap">
  <!-- ဘယ်ဖက်က ပုံ - အသေနေရာယူမယ် -->
  <div class="logo-circle">
    <!-- ဒီနေရာမှာ မင်း Drive က ပုံကို ထည့် - logo.png -->
    <img src="https://lh3.googleusercontent.com/d/1-k-biRtEHWKeb_tZKPXhZD2JCB6b9vds" alt="Arakan Art Area Logo">
  </div>

  <!-- ညာဖက်က ချန်နယ်အမည် - ပြောင်းနေမယ် -->
  <div class="name-box">
    <div class="name name1 active">Arakan Art Area</div>
    <div class="name name2">All Arakan Assets</div>
    <div class="name name3">အာရက္ခ အနုပညာ ရပ်ဝန်း</div>
  </div>
</div>

<script>
  const names = document.querySelectorAll('.name');
  let idx = 0;
  setInterval(() => {
    names[idx].classList.remove('active');
    names[idx].classList.add('out');
    setTimeout(() => names[idx].classList.remove('out'), 500);
    idx = (idx + 1) % names.length;
    names[idx].classList.add('active');
  }, 2600);
</script>

</body>
</html>

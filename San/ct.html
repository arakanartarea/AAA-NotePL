<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinematic Text Animation</title>
  <style>
    body {
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
    }
    #text-container {
      font-size: 4rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 0 5px #fff;
    }
    span {
      transition: color 0.1s, text-shadow 0.1s;
    }
  </style>
</head>
<body>

  <div id="text-container"></div>

  <script>
    const container = document.getElementById('text-container');
    const texts = ["Arakan Art Area", "အာရက္ခ အနုပညာ ရပ်ဝန်း"];
    const colors = ["#ff3366", "#33ccff", "#cc33ff", "#ffcc00"]; // အရောင် ၄ မျိုး
    let textIndex = 0;

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function playAnim() {
      container.style.opacity = 1;
      container.innerHTML = '';
      const currentStr = texts[textIndex];

      // စာလုံးတစ်လုံးစီ ဖန်တီးတာ
      for (let char of currentStr) {
        let span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.opacity = 0;
        container.appendChild(span);
      }

      let spans = container.querySelectorAll('span');

      // ဘယ်မှညာ တစ်လုံးစီ ပေါ်လာတာ
      for (let span of spans) {
        span.style.opacity = 1;
        await sleep(100); 
      }
      await sleep(1500);

      // အရောင် ၄ မျိုးနဲ့ တစ်ထပ်စီ ဖုံးသွားတာ
      for (let color of colors) {
        for (let span of spans) {
          span.style.color = color;
          span.style.textShadow = `0 0 15px ${color}`;
          await sleep(60);
        }
        await sleep(1000);
      }

      // စာတန်းပျောက်သွားတာ
      container.style.transition = 'opacity 0.8s';
      container.style.opacity = 0;
      await sleep(1000);

      // နောက်စာကြောင်းကို ပြောင်းပြီး ပြန်ကျော့တာ
      textIndex = (textIndex + 1) % texts.length;
      playAnim();
    }

    playAnim();
  </script>

</body>
</html>

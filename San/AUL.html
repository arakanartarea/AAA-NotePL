<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUL - All User List</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
  const t = Date.now();
  document.write(`<link rel="stylesheet" href="../html-reserve/LVE3-common.css?v=${t}">`);
  document.write(`<link rel="stylesheet" href="../html-reserve/LVE3-phone.css?v=${t}" media="(max-width: 768px)">`);
  document.write(`<link rel="stylesheet" href="../html-reserve/LVE3-tablet.css?v=${t}" media="(min-width: 769px)">`);
</script>
<style>
.aid-badge{background:#22c55e;color:#000;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;font-family:monospace;font-weight:700}
.role-badge{background:#eab308;color:#000;font-size:9px;padding:2px 6px;border-radius:10px;margin-left:6px}
.role-badge.admin{background:#16a34a;color:#fff}
.user-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#334155}
</style>
</head>
<body>

<header id="main-header">
  <div class="nav-btns">
    <input type="text" id="search-input" placeholder="AID / နာမည် / Email ရှာရန်..." oninput="filterUsers()">
  </div>
  <div id="status-badge" class="status-badge">Checking...</div>
</header>

<div id="list-view" class="view-section active">
  <div id="accordion-container">ခေါ်ယူနေသည်...</div>
  <div id="list-fab-container" style="position:fixed;bottom:27px;right:27px;z-index:1000;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;">
    <button onclick="toggleListFabMenu()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;">
      <span class="material-symbols-rounded">settings</span>
    </button>
    <div id="list-fab-menu" style="display:none;flex-direction:column-reverse;gap:10px;align-items:flex-end;">
      <button id="btn-login" onclick="handleAuthClick()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;">
        <span class="material-symbols-rounded">login</span>
      </button>
      <button onclick="toggleTheme()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;">
        <span class="material-symbols-rounded">dark_mode</span>
      </button>
    </div>
  </div>
</div>

<!-- EDIT VIEW -->
<div id="input-view" class="view-section">
  <h2 id="form-title">User ပြင်ရန် - Admin Only</h2>
  <div class="form-row">
    <div class="form-group"><label>AID</label><input type="text" id="inp-aid" disabled></div>
    <div class="form-group"><label>UID (docID)</label><input type="text" id="inp-uid" disabled></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Display Name</label><input type="text" id="inp-name"></div>
    <div class="form-group"><label>Email</label><input type="text" id="inp-email" disabled></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Role</label>
      <select id="inp-role"><option value="viewer">viewer</option><option value="editor">editor</option><option value="admin">admin</option></select>
    </div>
    <div class="form-group"><label>LoginCount</label><input type="text" id="inp-count" disabled></div>
  </div>
  <div class="form-group"><label>Device</label><input type="text" id="inp-device" disabled></div>

  <div id="edit-fab-container" style="position:fixed;bottom:27px;right:27px;z-index:1000;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;">
    <button onclick="saveUser()" style="width:54px;height:54px;background:#16a34a;color:#fff;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">save</span></button>
    <button onclick="switchView('list-view')" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">arrow_back</span></button>
  </div>
</div>

<!-- AUTH MODAL - LVE3 အတိုင်း -->
<div id="auth-modal" class="hidden">
  <div class="auth-box">
    <div class="auth-header">
      <span class="material-symbols-rounded" style="font-size:28px;color:#eab308;">account_circle</span>
      <div><div style="font-weight:700;color:#fff;" id="auth-modal-email"></div><div style="font-size:12px;color:var(--muted);">Admin အကောင့်ဝင်ထားသည်</div></div>
    </div>
    <div class="auth-actions">
      <button id="btn-auth-cancel" class="btn-auth secondary">မလုပ်တော့</button>
      <button id="btn-auth-logout" class="btn-auth danger">ထွက်မယ်</button>
      <button id="btn-auth-switch" class="btn-auth primary">ပြောင်းမယ်</button>
    </div>
  </div>
</div>

<script>
  const ts = Date.now();
  const s = document.createElement('script');
  s.src = 'AUL.js?v='+ts;
  document.body.appendChild(s);
</script>
</body>
</html>

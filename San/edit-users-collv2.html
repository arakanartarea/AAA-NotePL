<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - AAS Style</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
  const t = Date.now();
  document.write(`<link rel="stylesheet" href="../html-reserve/LVE3-common.css?v=${t}">`);
  document.write(`<link rel="stylesheet" href="../html-reserve/LVE3-phone.css?v=${t}" media="(max-width: 768px)">`);
  document.write(`<link rel="stylesheet" href="../html-reserve/LVE3-tablet.css?v=${t}" media="(min-width: 769px)">`);
  document.write(`<link rel="stylesheet" href="AAS-override.css?v=${t}">`);
</script>
<style>
.aid-badge{background:#22c55e;color:#000;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;font-family:monospace;font-weight:700}
.role-badge{background:#eab308;color:#000;font-size:9px;padding:2px 6px;border-radius:10px;margin-left:6px}
.role-badge.admin{background:#16a34a;color:#fff}
.user-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#334155}
#sortModal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);padding:16px;border-radius:12px;z-index:10000;width:85%;max-width:320px;border:1px solid #334155}
#sortOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999}
.sort-item{padding:10px 12px;margin:6px 0;background:var(--bg);border:1px solid #334155;border-radius:8px;cursor:pointer}
.sort-item.active{background:#E11D48;color:#fff}
</style>
</head>
<body>
<header id="main-header">
  <div class="nav-btns" style="flex:1">
    <input type="text" id="search-input" placeholder="AID / နာမည် / Email ရှာရန်..." oninput="filterUsers()">
  </div>
  <div id="status-badge" class="status-badge">Viewer</div>
</header>

<div id="list-view" class="view-section active">
  <div id="accordion-container">ခေါ်ယူနေသည်...</div>
  <div id="list-fab-container" style="position:fixed;bottom:27px;right:27px;z-index:1000;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;">
    <button onclick="openCreateForm()" id="btn-add" style="display:none;width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">add</span></button>
    <button onclick="toggleListFabMenu()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">settings</span></button>
    <div id="list-fab-menu" style="display:none;flex-direction:column-reverse;gap:10px;align-items:flex-end;">
      <button id="btn-login" onclick="handleAuthClick()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">login</span></button>
      <button onclick="toggleTheme()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">dark_mode</span></button>
      <button onclick="openSortModal()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">sort</span></button>
    </div>
  </div>
</div>

<div id="input-view" class="view-section">
  <h2 id="form-title">User ပြင်</h2>
  <div class="form-group"><label>AID</label><input type="text" id="inp-aid" disabled></div>
  <div class="form-group"><label>Display Name</label><input type="text" id="inp-name"></div>
  <div class="form-group"><label>Email</label><input type="text" id="inp-email" disabled></div>
  <div class="form-group"><label>Role</label>
    <select id="inp-role" style="width:100%;padding:10px;border-radius:8px;background:var(--bg);color:var(--text)"><option value="viewer">viewer</option><option value="editor">editor</option><option value="admin">admin</option></select>
  </div>
  <button onclick="saveUser()" style="padding:10px 20px;background:#16a34a;color:#fff;border:0;border-radius:8px;cursor:pointer">Save</button>
  <button onclick="switchView('list-view')" style="padding:10px 20px">Back</button>
</div>

<div id="auth-modal" class="hidden"><div class="auth-box"><div class="auth-header"><span class="material-symbols-rounded" style="font-size:28px;color:#eab308;">account_circle</span><div><div style="font-weight:700;color:#fff;" id="auth-modal-email"></div><div style="font-size:12px;color:var(--muted);">Admin အကောင့်ဝင်ထားသည်</div></div></div><div class="auth-actions"><button id="btn-auth-cancel" class="btn-auth secondary">မလုပ်တော့</button><button id="btn-auth-logout" class="btn-auth danger">ထွက်မယ်</button><button id="btn-auth-switch" class="btn-auth primary">ပြောင်းမယ်</button></div></div></div>
<div id="sortOverlay" onclick="closeSortModal()"></div><div id="sortModal"><h3>Sort ရွေး</h3><div class="sort-item active" data-sort="aid" onclick="setSort('aid',this)">AID အငယ်ကနေ အကြီး</div><div class="sort-item" data-sort="name" onclick="setSort('name',this)">နာမည် A-Z</div><div class="sort-item" data-sort="role" onclick="setSort('role',this)">Role အလိုက်</div><div class="sort-item" data-sort="new" onclick="setSort('new',this)">Login နောက်ဆုံးကနေ</div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdPFzE2_Rbg8Xi-9DGBvfoOA95c1R3S4U",
  authDomain: "arakanartarea-note.firebaseapp.com",
  projectId: "arakanartarea-note",
  storageBucket: "arakanartarea-note.firebasestorage.app",
  messagingSenderId: "695659736666",
  appId: "1:695659736666:web:1e76494c0e6819609bf263"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let allUsers=[], filtered=[], editingDocId=null, isAdmin=false, currentUser=null;
let sortBy='aid';
function formatAID(n){ if(n==null) return "-"; return `A-${String(n).padStart(7,'0')}`; }

function init(){
  auth.onAuthStateChanged(async (u)=>{
    currentUser=u;
    if(u){
      try{
        const email=u.email.toLowerCase();
        // admin စစ်တာ users collection က role ကိုစစ်မယ်
        const me = await db.collection('users').doc(u.uid).get();
        isAdmin = me.exists && me.data().role==='admin';
        // admins coll ဟောင်းလဲ စစ်မယ်
        if(!isAdmin){
          const adminDoc=await db.collection('admins').doc(email).get();
          isAdmin=adminDoc.exists;
        }
      }catch(e){isAdmin=false}
    }else{isAdmin=false}
    updateUI();
  });
  db.collection('users').onSnapshot(snap=>{
    allUsers=[]; snap.forEach(d=>{ let data=d.data(); data._uid=d.id; allUsers.push(data); });
    filterUsers();
  });
}
function updateUI(){
  const badge=document.getElementById('status-badge');
  const loginIcon=document.querySelector('#btn-login .material-symbols-rounded');
  const addBtn=document.getElementById('btn-add');
  if(badge){
    if(isAdmin&&currentUser){badge.textContent='Admin: '+(currentUser.displayName||'');badge.style.background='#16a34a';badge.style.color='#fff';}
    else{badge.textContent=currentUser?'Viewer: '+currentUser.email.split('@')[0]:'Viewer';badge.style.background='#eab308';badge.style.color='#000';}
  }
  if(loginIcon) loginIcon.textContent=currentUser?'logout':'login';
  if(addBtn) addBtn.style.display=isAdmin?'grid':'none';
}
function handleAuthClick(){
  if(currentUser){document.getElementById('auth-modal-email').textContent=currentUser.email;document.getElementById('auth-modal').classList.remove('hidden');}
  else{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p);}
}
document.getElementById('btn-auth-cancel').onclick=()=>document.getElementById('auth-modal').classList.add('hidden');
document.getElementById('btn-auth-logout').onclick=()=>{document.getElementById('auth-modal').classList.add('hidden');auth.signOut();};
document.getElementById('btn-auth-switch').onclick=()=>{document.getElementById('auth-modal').classList.add('hidden');auth.signOut().then(()=>{setTimeout(()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p);},400);});};

function switchView(id){document.querySelectorAll('.view-section').forEach(el=>el.classList.remove('active'));document.getElementById(id).classList.add('active');}
function toggleListFabMenu(){const m=document.getElementById('list-fab-menu');m.style.display=m.style.display==='flex'?'none':'flex';}
function toggleTheme(){let d=document.body.classList.toggle('dark-mode');localStorage.setItem('theme',d?'dark':'light');}
if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark-mode');

function filterUsers(){
  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  let data=allUsers.filter(u=>{
    if(!q) return true;
    return (u.displayName||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q) || formatAID(u.AID).toLowerCase().includes(q) || String(u.AID||'').includes(q);
  });
  data.sort((a,b)=>{
    if(sortBy==='aid') return (a.AID||0)-(b.AID||0);
    if(sortBy==='name') return (a.displayName||'').localeCompare(b.displayName||'');
    if(sortBy==='role') return (a.role||'').localeCompare(b.role||'');
    if(sortBy==='new') return (b.lastLogin?.seconds||0)-(a.lastLogin?.seconds||0);
    return 0;
  });
  filtered=data;
  render();
}
function render(){
  const c=document.getElementById('accordion-container'); c.innerHTML='';
  const grouped={};
  filtered.forEach(u=>{
    let key = u.role==='admin' ? '👑 Admin' : '👤 Users';
    if(sortBy==='role') key = u.role||'viewer';
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(u);
  });
  Object.keys(grouped).sort().forEach(g=>{
    const users=grouped[g];
    const acc=document.createElement('div');acc.className='accordion';
    const header=document.createElement('div');header.className='accordion-header';
    header.innerHTML=`<span>🎤 ${g} (${users.length})</span><span>▼</span>`;
    header.onclick=()=>acc.classList.toggle('open');
    const content=document.createElement('div');content.className='accordion-content';
    content.innerHTML=users.map(u=>{
      const photo = u.photoURL ? `<img src="${u.photoURL}" referrerpolicy="no-referrer" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.displayName||'A')}&background=random'" class="user-avatar">` : `<img src="https://ui-avatars.com/api/?name=${encodeURIComponent(u.displayName||'A')}&background=random" class="user-avatar">`;
      return `<div class="song-item"><div style="display:flex;gap:10px;align-items:center"><div>${photo}</div><span class="song-title-click">${u.displayName||'No Name'}<span class="aid-badge">${formatAID(u.AID)}</span><span class="role-badge ${u.role==='admin'?'admin':''}">${u.role||'viewer'}</span><br><small style="color:var(--muted)">${u.email||''} | Login: ${u.loginCount||1} | ${u.device?u.device.substring(0,30)+'...':''}</small></span></div><div class="item-actions"><div style="display:${isAdmin?'flex':'none'};gap:4px"><button class="icon-btn" onclick="editUser('${u._uid}')">📝</button><button class="icon-btn" onclick="deleteUser('${u._uid}')">🗑️</button></div></div></div>`;
    }).join('');
    acc.appendChild(header);acc.appendChild(content);c.appendChild(acc);
  });
}
function editUser(uid){if(!isAdmin)return;db.collection('users').doc(uid).get().then(d=>{if(!d.exists)return;const u=d.data();editingDocId=uid;document.getElementById('inp-aid').value=formatAID(u.AID);document.getElementById('inp-name').value=u.displayName||'';document.getElementById('inp-email').value=u.email||'';document.getElementById('inp-role').value=u.role||'viewer';switchView('input-view');});}
function saveUser(){if(!isAdmin||!editingDocId)return;const payload={displayName:document.getElementById('inp-name').value.trim(), role:document.getElementById('inp-role').value};db.collection('users').doc(editingDocId).update(payload).then(()=>switchView('list-view')).catch(e=>alert(e.message));}
function deleteUser(uid){if(!isAdmin)return;if(confirm('ဖျက်မလား '+uid+'?')) db.collection('users').doc(uid).delete();}
function openCreateForm(){alert('User က login ဝင်မှ auto ပေါ်လာမယ်, ကိုယ်တိုင်မထည့်ရ');}
function openSortModal(){document.getElementById('sortModal').style.display='block';document.getElementById('sortOverlay').style.display='block';}
function closeSortModal(){document.getElementById('sortModal').style.display='none';document.getElementById('sortOverlay').style.display='none';}
function setSort(s,el){sortBy=s;document.querySelectorAll('.sort-item').forEach(e=>e.classList.remove('active'));el.classList.add('active');closeSortModal();filterUsers();}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #00ff00; /* Green Screen Background */
      margin: 0;
    }

    .container {
      position: relative;
    }

    .action-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%);
      border: 2px solid #1a1a1a;
      border-radius: 20px;
      padding: 15px 40px;
      gap: 50px;
      box-shadow: 0 5px 0 #1a1a1a;
    }

    .btn {
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #1a1a1a;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill 0.3s, stroke 0.3s;
    }

    /* Hand Pointer Cursor Animation */
    .pointer {
      position: absolute;
      width: 32px;
      height: 32px;
      z-index: 10;
      animation: moveAndClick 5s infinite ease-in-out;
      pointer-events: none;
    }

    /* Target Animations synchronized with cursor */
    .heart-icon {
      animation: likeAnim 5s infinite;
    }

    .comment-icon {
      animation: commentAnim 5s infinite;
    }

    .share-icon {
      animation: shareAnim 5s infinite;
    }

    /* Cursor Path & Click Scale Animation */
    @keyframes moveAndClick {
      0% { top: 70px; left: -20px; transform: scale(1); }
      
      /* Move to Heart & Click */
      15% { top: 22px; left: 42px; transform: scale(1); }
      20% { top: 22px; left: 42px; transform: scale(0.8); }
      25% { top: 22px; left: 42px; transform: scale(1); }

      /* Move to Comment & Click */
      45% { top: 22px; left: 128px; transform: scale(1); }
      50% { top: 22px; left: 128px; transform: scale(0.8); }
      55% { top: 22px; left: 128px; transform: scale(1); }

      /* Move to Share & Click */
      75% { top: 22px; left: 214px; transform: scale(1); }
      80% { top: 22px; left: 214px; transform: scale(0.8); }
      85% { top: 22px; left: 214px; transform: scale(1); }

      /* Exit Screen */
      100% { top: 70px; left: 300px; transform: scale(1); }
    }

    /* Heart Color Fill Animation */
    @keyframes likeAnim {
      0%, 20% { fill: none; stroke: #1a1a1a; transform: scale(1); }
      22% { transform: scale(0.85); }
      25% { fill: #ff2d55; stroke: #ff2d55; transform: scale(1.1); }
      28%, 100% { fill: #ff2d55; stroke: #ff2d55; transform: scale(1); }
    }

    /* Comment Icon Animation */
    @keyframes commentAnim {
      0%, 50% { fill: none; stroke: #1a1a1a; transform: scale(1); }
      52% { transform: scale(0.85); }
      55% { fill: #1a1a1a; stroke: #1a1a1a; transform: scale(1.1); }
      58%, 100% { fill: #1a1a1a; stroke: #1a1a1a; transform: scale(1); }
    }

    /* Share Icon Animation */
    @keyframes shareAnim {
      0%, 80% { stroke: #1a1a1a; transform: scale(1); }
      82% { transform: scale(0.85); }
      85% { stroke: #007aff; transform: scale(1.1); }
      88%, 100% { stroke: #007aff; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <svg class="pointer" viewBox="0 0 24 24" fill="#1a1a1a">
      <path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74a3 3 0 0 1 1.05-.24 2.5 2.5 0 0 1 2.5 2.5v2.5a6.5 6.5 0 0 1-6.5 6.5h-1A6.5 6.5 0 0 1 3.5 16v-3.5a2.5 2.5 0 0 1 5 0v-1.26a2.48 2.48 0 0 1 .5-.1z"/>
    </svg>

    <div class="action-bar">
      <button class="btn">
        <svg class="icon heart-icon" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>

      <button class="btn">
        <svg class="icon comment-icon" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>

      <button class="btn">
        <svg class="icon share-icon" viewBox="0 0 24 24">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>
        </svg>
      </button>
    </div>
  </div>

</body>
</html>

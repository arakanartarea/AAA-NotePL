<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ဉာဏ်စမ်း Video Maker - 9:16</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Myanmar','Myanmar Text',Pyidaungsu,system-ui,sans-serif;background:#f7f5f0;color:#18181b;min-height:100dvh}
.wrap{max-width:500px;margin:0 auto;padding-bottom:140px}
.header{position:sticky;top:0;z-index:5;background:rgba(247,245,240,0.9);backdrop-filter:blur(12px);border-bottom:1px solid #e4e4e7;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;font-weight:800}
.header .badge{background:#18181b;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:18px;padding:16px;margin:16px 16px 0 16px;box-shadow:0 2px 20px rgba(0,0,0,0.04)}
.label{font-size:13px;font-weight:700;color:#3f3f46;margin-bottom:8px;display:block}
.input-row{display:flex;gap:8px;align-items:center}
.input-row .main{flex:1}
input[type="text"],input[type="number"],textarea,select{width:100%;padding:12px 14px;border:1px solid #d4d4d8;border-radius:12px;font-size:15px;font-family:inherit;outline:none;background:#fafafa}
input:focus,textarea:focus{border-color:#18181b;background:#fff}
textarea{resize:vertical;min-height:70px}
.size-wrap{width:110px;flex-shrink:0}
.size-wrap label{font-size:11px;color:#71717a;font-weight:600}
.size-wrap input{text-align:center;font-weight:700}
.img-preview{margin-top:10px;border-radius:14px;overflow:hidden;border:1px dashed #d4d4d8;min-height:90px;display:grid;place-items:center;background:#fafafa;position:relative}
.img-preview img{width:100%;height:auto;display:block;max-height:260px;object-fit:contain}
.img-preview .placeholder{padding:18px;color:#a1a1aa;font-size:13px}
.remove-img{position:absolute;top:8px;right:8px;background:#000;color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-top:1px solid #e4e4e7;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:10}
.bottom-bar button{flex:1;padding:16px;border-radius:14px;border:none;font-weight:800;font-size:16px;cursor:pointer}
.btn-clear{background:#f4f4f5;color:#18181b;border:1px solid #e4e4e7 !important}
.btn-view{background:#18181b;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,0.2)}
#viewPage{display:none;position:fixed;inset:0;z-index:20;background:#000;justify-content:center;align-items:center}
.view-frame{position:relative;width:100%;max-width:420px;height:100dvh;max-height:900px;aspect-ratio:9/16;background:#111;overflow:hidden;display:flex;flex-direction:column}
.view-bg{position:absolute;inset:0}
.view-bg img{width:100%;height:100%;object-fit:cover}
.view-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.65))}
.view-content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:18px 16px}
.timer-wrap{display:flex;flex-direction:column;align-items:center}
.timer-circle{width:82px;height:82px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.timer-circle span{font-size:30px;font-weight:900;color:#111}
.timer-bar{margin-top:8px;height:6px;width:82px;background:rgba(255,255,255,0.2);border-radius:99px;overflow:hidden}
.timer-bar i{display:block;height:100%;background:#fff;transition:width 1s linear}
.q-img-wrap{margin-top:16px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);display:none}
.q-img-wrap img{width:100%;height:auto;display:block;object-fit:contain;max-height:34vh}
.q-text{margin-top:16px;text-align:center;color:#fff;font-weight:700;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,0.6);word-wrap:break-word;white-space:pre-wrap;overflow-wrap:anywhere}
.answers{margin-top:auto;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans-box{min-height:68px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(12px);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;color:#fff;transition:all 0.4s}
.ans-box .letter{width:26px;height:26px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:800;font-size:11px;flex-shrink:0}
.ans-box .txt{flex:1;line-height:1.25;word-wrap:break-word;white-space:pre-wrap;overflow-wrap:anywhere}
.ans-box.correct{background:#22c55e;border-color:#22c55e}
.ans-box.wrong{background:#ef4444;border-color:#ef4444}
.hint{margin-top:12px;text-align:center;color:rgba(255,255,255,0.5);font-size:10px}
</style>
</head>
<body>

<div id="inputPage" class="wrap">
  <div class="header">
    <div><h1>ဉာဏ်စမ်း Data Input</h1><div style="font-size:11px;color:#71717a;margin-top:4px">ပြီးရင် အောက်က View ကိုနှိပ်ပါ</div></div>
    <div class="badge">9:16</div>
  </div>

  <div class="card">
    <label class="label">ပုံ (မူလအချိုးအတိုင်း သိမ်းမယ်)</label>
    <input type="file" id="imgFile" accept="image/*">
    <div id="imgPreview" class="img-preview"><div class="placeholder">ပုံမရွေးရသေးပါ</div></div>
  </div>

  <div class="card">
    <label class="label">မေးခွန်း</label>
    <div class="input-row">
      <div class="main"><textarea id="qText" placeholder="ဥပမာ - ဒီတိရိစ္ဆာန်က ဘာလဲ?"></textarea></div>
      <div class="size-wrap"><label>Text Size</label><input type="text" inputmode="numeric" id="qSize" value="22"></div>
    </div>
  </div>

  <div class="card">
    <label class="label">အဖြေ ၄ ခု</label>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="input-row"><div class="main"><input type="text" id="aText" placeholder="အဖြေ A"></div><div class="size-wrap"><label>A Size</label><input type="text" inputmode="numeric" id="aSize" value="18"></div></div>
      <div class="input-row"><div class="main"><input type="text" id="bText" placeholder="အဖြေ B"></div><div class="size-wrap"><label>B Size</label><input type="text" inputmode="numeric" id="bSize" value="18"></div></div>
      <div class="input-row"><div class="main"><input type="text" id="cText" placeholder="အဖြေ C"></div><div class="size-wrap"><label>C Size</label><input type="text" inputmode="numeric" id="cSize" value="18"></div></div>
      <div class="input-row"><div class="main"><input type="text" id="dText" placeholder="အဖြေ D"></div><div class="size-wrap"><label>D Size</label><input type="text" inputmode="numeric" id="dSize" value="18"></div></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;gap:12px">
      <div style="flex:1"><label class="label">အဖြေမှန်နံပါတ် (1=A, 2=B, 3=C, 4=D)</label><select id="correct"><option value="1">1 - A</option><option value="2">2 - B</option><option value="3">3 - C</option><option value="4">4 - D</option></select></div>
      <div style="width:130px"><label class="label">အချိန် (စက္ကန့်)</label><input type="text" inputmode="numeric" id="timeVal" value="30"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-clear" id="clearBtn">Clear</button>
    <button class="btn-view" id="viewBtn">View 9:16</button>
  </div>
</div>

<div id="viewPage">
  <div class="view-frame">
    <div class="view-bg">
      <!-- နောက်ခံပုံ လဲချင်ရင် ဒီလင့်ပဲ ပြင်ပါ -->
      <img id="bgImg" src="https://drive.google.com/file/d/1tS81VXlg-He5T0gugydMtFW6uUq5mMhL/view?usp=drivesdk" alt="bg">
      <div class="view-overlay"></div>
    </div>
    <div class="view-content">
      <div class="timer-wrap">
        <div class="timer-circle"><span id="timerNum">30</span></div>
        <div class="timer-bar"><i id="timerBar" style="width:100%"></i></div>
      </div>
      <div class="q-img-wrap" id="viewImgWrap"><img id="viewImg" src=""></div>
      <div class="q-text" id="viewQ">မေးခွန်းမရှိသေးပါ</div>
      <div class="answers" id="viewAnswers"></div>
      <div class="hint">Phone Back နှိပ်ပြီး Input ကိုပြန်ပါ</div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'quizMakerData_v2';
const els = {
  imgFile: document.getElementById('imgFile'),
  imgPreview: document.getElementById('imgPreview'),
  qText: document.getElementById('qText'),
  qSize: document.getElementById('qSize'),
  aText: document.getElementById('aText'),
  aSize: document.getElementById('aSize'),
  bText: document.getElementById('bText'),
  bSize: document.getElementById('bSize'),
  cText: document.getElementById('cText'),
  cSize: document.getElementById('cSize'),
  dText: document.getElementById('dText'),
  dSize: document.getElementById('dSize'),
  correct: document.getElementById('correct'),
  timeVal: document.getElementById('timeVal'),
  clearBtn: document.getElementById('clearBtn'),
  viewBtn: document.getElementById('viewBtn'),
  inputPage: document.getElementById('inputPage'),
  viewPage: document.getElementById('viewPage'),
  timerNum: document.getElementById('timerNum'),
  timerBar: document.getElementById('timerBar'),
  viewImgWrap: document.getElementById('viewImgWrap'),
  viewImg: document.getElementById('viewImg'),
  viewQ: document.getElementById('viewQ'),
  viewAnswers: document.getElementById('viewAnswers')
};
let imageDataUrl = null;
let timerInterval = null;
function parseSize(str, fallback){
  if(str.trim()==='') return fallback;
  const n = parseInt(str,10);
  return isNaN(n) ? fallback : n;
}
function save(){
  const data = {
    imageDataUrl: imageDataUrl,
    qText: els.qText.value, qSize: els.qSize.value,
    aText: els.aText.value, aSize: els.aSize.value,
    bText: els.bText.value, bSize: els.bSize.value,
    cText: els.cText.value, cSize: els.cSize.value,
    dText: els.dText.value, dSize: els.dSize.value,
    correct: els.correct.value, timeVal: els.timeVal.value
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    imageDataUrl = d.imageDataUrl || null;
    if(imageDataUrl) renderImgPreview();
    els.qText.value = d.qText||''; els.qSize.value = d.qSize||'22';
    els.aText.value = d.aText||''; els.aSize.value = d.aSize||'18';
    els.bText.value = d.bText||''; els.bSize.value = d.bSize||'18';
    els.cText.value = d.cText||''; els.cSize.value = d.cSize||'18';
    els.dText.value = d.dText||''; els.dSize.value = d.dSize||'18';
    els.correct.value = d.correct||'1'; els.timeVal.value = d.timeVal||'30';
  }catch(e){}
}
function renderImgPreview(){
  if(!imageDataUrl){ els.imgPreview.innerHTML='<div class="placeholder">ပုံမရွေးရသေးပါ</div>'; return;}
  els.imgPreview.innerHTML = `<img src="${imageDataUrl}"><button class="remove-img" onclick="clearImage()">✕</button>`;
}
window.clearImage = function(){ imageDataUrl=null; els.imgFile.value=''; renderImgPreview(); save(); }
els.imgFile.addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ imageDataUrl = reader.result; renderImgPreview(); save(); };
  reader.readAsDataURL(file);
});
['input','change'].forEach(ev=>{
  Object.values(els).forEach(el=>{
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT')){
      el.addEventListener(ev, save);
    }
  })
});
els.clearBtn.addEventListener('click', ()=>{
  if(!confirm('အကုန်ရှင်းမလား?')) return;
  localStorage.removeItem(STORAGE_KEY);
  imageDataUrl=null;
  els.qText.value=''; els.qSize.value='22';
  els.aText.value=''; els.aSize.value='18';
  els.bText.value=''; els.bSize.value='18';
  els.cText.value=''; els.cSize.value='18';
  els.dText.value=''; els.dSize.value='18';
  els.correct.value='1'; els.timeVal.value='30';
  els.imgFile.value=''; renderImgPreview();
});
els.viewBtn.addEventListener('click', ()=>{
  history.pushState({view:true}, '', '#view');
  openView();
});
function openView(){
  const time = parseSize(els.timeVal.value, 30);
  const qSize = parseSize(els.qSize.value, 22);
  const aSize = parseSize(els.aSize.value, 18);
  const bSize = parseSize(els.bSize.value, 18);
  const cSize = parseSize(els.cSize.value, 18);
  const dSize = parseSize(els.dSize.value, 18);
  els.viewQ.textContent = els.qText.value || 'မေးခွန်းမရှိသေးပါ';
  els.viewQ.style.fontSize = qSize + 'px';
  if(imageDataUrl){ els.viewImg.src = imageDataUrl; els.viewImgWrap.style.display='block'; }
  else{ els.viewImgWrap.style.display='none'; }
  const answers = [
    {t: els.aText.value||'A', s: aSize},
    {t: els.bText.value||'B', s: bSize},
    {t: els.cText.value||'C', s: cSize},
    {t: els.dText.value||'D', s: dSize},
  ];
  const correctIdx = parseInt(els.correct.value,10)-1;
  els.viewAnswers.innerHTML = answers.map((a,i)=>{
    return `<div class="ans-box" data-idx="${i}"><div class="letter">${String.fromCharCode(65+i)}</div><div class="txt" style="font-size:${a.s}px">${a.t}</div></div>`;
  }).join('');
  els.viewPage.style.display='flex';
  els.inputPage.style.display='none';
  let remaining = time;
  els.timerNum.textContent = remaining;
  els.timerBar.style.width='100%';
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    remaining--; els.timerNum.textContent = remaining;
    els.timerBar.style.width = Math.max(0,(remaining/time)*100)+'%';
    if(remaining<=0){
      clearInterval(timerInterval);
      document.querySelectorAll('.ans-box').forEach(box=>{
        const idx = parseInt(box.dataset.idx,10);
        if(idx===correctIdx) box.classList.add('correct');
        else box.classList.add('wrong');
      });
    }
  },1000);
}
function closeView(){ els.viewPage.style.display='none'; els.inputPage.style.display='block'; clearInterval(timerInterval); }
window.addEventListener('popstate', e=>{ if(location.hash!=='#view') closeView(); });
load();
if(location.hash==='#view'){ openView(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Green Template</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;height:100vh;width:100vw;overflow:hidden;font-family:Pyidaungsu,sans-serif}
.view{position:fixed;inset:0;display:none;z-index:1}
.view.active{display:flex}

/* MAIN - Data Input */
#mainView{background:#000;flex-direction:column;padding:15px 15px 70px 15px;overflow-y:auto;gap:12px}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:13px;color:#888}
.input-group input{width:100%;height:44px;background:#111;border:1px solid #222;color:#fff;border-radius:8px;padding:0 12px;font-size:15px}
.input-group input:focus{border-color:#00c853;outline:none}

/* FONT LIST - Main ရဲ့အပေါ်မှာ သီးသန့် */
#fontListView{position:fixed;left:0;right:0;bottom:56px;max-height:45vh;background:#121212;border-top:1px solid #333;z-index:5;display:none;flex-direction:column;overflow-y:auto}
#fontListView.show{display:flex}
.font-item{padding:14px 16px;border-bottom:1px solid #222;font-size:18px;cursor:pointer}
.font-item:active{background:#1e1e1e;color:#00c853}

/* TIKTOK GREEN VIEW */
#tiktokView{background:#00FF00;justify-content:flex-end;align-items:center;padding-right:12px}
.tiktok-bar{
  width:78px;
  border:2.5px solid #000;
  border-radius:18px;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 0 12px 0;
  gap:12px;
}
.t-profile{width:52px;height:52px;border-radius:50%;border:2px solid #000;object-fit:cover;background:#333;position:relative}
.t-check{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:1.5px solid #000;font-size:12px;color:#000}
.t-icon{font-size:32px;color:#000;-webkit-text-stroke:1px #fff;filter:drop-shadow(0 0 1px #fff)}
.t-icon.heart{color:#ff2d55;-webkit-text-stroke:1.5px #fff}
.t-num{font-size:14px;font-weight:700;color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 0 2px #000;margin-top:-6px}
.t-bottom-disc{width:52px;height:52px;border-radius:50%;border:2px solid #000;object-fit:cover;background:#333}

/* Bottom Bar - padding margin မရှိ */
#bottomBar{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;background:#0a0a0a;z-index:10;border-top:1px solid #222}
.bar-btn{flex:1;margin:0;padding:0;border:none;background:transparent;color:#fff;font-size:20px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.bar-btn.active{color:#00c853}
</style>
</head>
<body>

<!-- MAIN -->
<div id="mainView" class="view active">
  <div class="input-group"><label>Profile ပုံ (Top) - URL / Drive ID</label><input id="inTopImg" placeholder="https://... သို့မဟုတ် Drive ID"></div>
  <div class="input-group"><label>Bottom Disc ပုံ (မထည့်ရင် အပေါ်ပုံနဲ့တူ)</label><input id="inBottomImg" placeholder="https://..."></div>
  <div class="input-group"><label>Like အရေအတွက်</label><input id="inLike" value="1.8k"></div>
  <div class="input-group"><label>Comment အရေအတွက်</label><input id="inComment" value="1.8k"></div>
  <div class="input-group"><label>Bookmark / Save</label><input id="inSave" value="1.8k"></div>
  <div class="input-group"><label>Share အရေအတွက်</label><input id="inShare" value="1.8k"></div>
</div>

<!-- FONT LIST - Main အပေါ်က သီးသန့် List -->
<div id="fontListView">
  <div class="font-item" data-font="Pyidaungsu">Pyidaungsu - မြန်မာ</div>
  <div class="font-item" data-font="Arial">Arial</div>
  <div class="font-item" data-font="Impact">Impact - Bold</div>
  <div class="font-item" data-font="monospace">Monospace</div>
  <div class="font-item" data-font="cursive">Cursive</div>
</div>

<!-- TIKTOK GREEN VIEW -->
<div id="tiktokView" class="view">
  <div class="tiktok-bar">
    <div style="position:relative">
      <img id="tTopImg" class="t-profile" src="https://i.pravatar.cc/100?img=8">
      <div class="t-check"><i class="fa-solid fa-check"></i></div>
    </div>
    <i class="fa-solid fa-heart t-icon heart"></i>
    <div id="tLike" class="t-num">1.8k</div>
    <!-- comment icon ပုံထဲက လက်ညှိုး -->
    <div style="font-size:38px;line-height:1;margin-top:4px">👆</div>
    <div id="tComment" class="t-num">1.8k</div>
    <i class="fa-solid fa-bookmark t-icon"></i>
    <div id="tSave" class="t-num">1.8k</div>
    <i class="fa-solid fa-share t-icon"></i>
    <div id="tShare" class="t-num">1.8k</div>
    <img id="tBottomImg" class="t-bottom-disc" src="https://i.pravatar.cc/100?img=8">
  </div>
</div>

<div id="youtubeView" class="view" style="background:#00c853;justify-content:center;align-items:center;color:#000">YouTube View - နောက်မှ</div>
<div id="facebookView" class="view" style="background:#00c853;justify-content:center;align-items:center;color:#000">Facebook View - နောက်မှ</div>

<!-- BOTTOM BAR -->
<div id="bottomBar">
  <button class="bar-btn active" data-view="mainView"><i class="fa-solid fa-font"></i></button>
  <button class="bar-btn" data-view="youtubeView"><i class="fa-brands fa-youtube"></i></button>
  <button class="bar-btn" data-view="facebookView"><i class="fa-brands fa-facebook"></i></button>
  <button class="bar-btn" data-view="tiktokView"><i class="fa-brands fa-tiktok"></i></button>
</div>

<script>
const $ = id=>document.getElementById(id);
function toDirectLink(v){
  if(!v) return '';
  v=v.trim();
  if(v.includes('drive.google.com') || v.length>20 && !v.includes('http')){
    let fileId=v;
    if(v.includes('/d/')) fileId=v.split('/d/')[1].split('/')[0];
    else if(v.includes('id=')) fileId=v.split('id=')[1].split('&')[0];
    return `https://lh3.googleusercontent.com/d/${fileId}=w200-h200`;
  }
  return v;
}
function updateTikTok(){
  const top = toDirectLink($('inTopImg').value) || 'https://i.pravatar.cc/100?img=8';
  const bottom = toDirectLink($('inBottomImg').value) || top;
  $('tTopImg').src=top; $('tBottomImg').src=bottom;
  $('tLike').textContent=$('inLike').value;
  $('tComment').textContent=$('inComment').value;
  $('tSave').textContent=$('inSave').value;
  $('tShare').textContent=$('inShare').value;
}
['inTopImg','inBottomImg','inLike','inComment','inSave','inShare'].forEach(id=>{
  $(id).addEventListener('input',updateTikTok);
});

// bottom bar logic
const btns=document.querySelectorAll('.bar-btn');
const views=document.querySelectorAll('.view');
btns.forEach(btn=>{
  btn.addEventListener('click',()=>{
    const target=btn.dataset.view;
    const fontList=$('fontListView');
    // Fonts button = mainView + font list toggle
    if(target==='mainView'){
      const isShowing = fontList.classList.contains('show');
      if(!isShowing){
        fontList.classList.add('show');
        // main ကိုမပိတ်ဘူး၊ font list က အပေါ်မှာပဲပေါ်မယ်
        btns.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        return;
      }else{
        fontList.classList.remove('show');
      }
    }else{
      fontList.classList.remove('show');
    }
    views.forEach(v=>v.classList.remove('active'));
    $(target).classList.add('active');
    if(target==='tiktokView') updateTikTok();
    btns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});
// font select
document.querySelectorAll('.font-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const f=item.dataset.font;
    document.body.style.fontFamily=f;
    $('fontListView').classList.remove('show');
  });
});
updateTikTok();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel Logo - Green Screen Ring</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
  body { background: #111; color: #fff; overflow-x: hidden; }

  /* Top Bar */
  .topbar {
    position: fixed; top:0; left:0; right:0;
    height: 60px; background:#1e1e1e;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; z-index: 100;
    border-bottom:1px solid #333;
  }
  .topbar button {
    padding:10px 18px; border-radius:8px; border:none;
    font-weight:bold; cursor:pointer;
  }
  #btnEdit { background:#333; color:#fff; }
  #btnView { background:#00FF00; color:#000; }

  /* Layouts */
  .layout { display:none; padding-top:70px; min-height:100vh; }
  .layout.active { display:flex; }
  
  /* EDIT LAYOUT */
  #editLayout {
    flex-direction:column; align-items:center; justify-content:center;
    background:#121212; padding:80px 20px 20px;
  }
  .upload-box {
    width:100%; max-width:400px; background:#1e1e1e;
    border:2px dashed #444; border-radius:16px;
    padding:30px; text-align:center;
  }
  .upload-box input { display:none; }
  .upload-btn {
    display:inline-block; background:#fff; color:#000;
    padding:14px 24px; border-radius:10px; font-weight:bold; cursor:pointer;
    margin-top:10px;
  }
  #previewThumb {
    width:140px; height:140px; border-radius:50%;
    object-fit:cover; display:none; margin:20px auto;
    border:3px solid #333;
  }
  .hint { color:#888; font-size:14px; margin-top:15px; }

  /* VIEW LAYOUT - GREEN SCREEN */
  #viewLayout {
    background:#00FF00; /* Chroma Green */
    align-items:center; justify-content:center;
    position:relative;
  }
  
  /* Logo Container */
  .logo-wrapper {
    position:relative;
    width: 72vw; height: 72vw;
    max-width: 500px; max-height: 500px;
    display:flex; align-items:center; justify-content:center;
  }

  /* Rainbow Ring - CSS နဲ့ ရေးထားတဲ့ ကွင်း */
  .rainbow-ring {
    position:absolute;
    top:-20px; left:-20px; right:-20px; bottom:-20px;
    border-radius:50%;
    background: conic-gradient(
      from 0deg,
      #ff0000, #ff9900, #ffff00, #00ff00, #00ffff, #0000ff, #9900ff, #ff0000
    );
    animation: rotateRing 2s linear infinite;
    z-index:1;
  }
  .rainbow-ring::after {
    content:'';
    position:absolute;
    top:12px; left:12px; right:12px; bottom:12px;
    background:#00FF00;
    border-radius:50%;
  }

  /* အတွင်းအဝိုင်း ပုံ */
  .logo-circle {
    position:relative;
    width:100%; height:100%;
    border-radius:50%;
    overflow:hidden;
    z-index:2;
    background:#000;
    box-shadow: 0 0 0 8px #00FF00;
  }
  .logo-circle img {
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .placeholder-text {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    color:#555; font-size:18px; text-align:center;
    background:#222;
  }

  @keyframes rotateRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Mobile */
  @media(max-width:600px){
    .logo-wrapper { width:80vw; height:80vw; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button id="btnEdit">Edit Layout</button>
  <button id="btnView">View Layout (Green Screen)</button>
</div>

<!-- EDIT LAYOUT -->
<div id="editLayout" class="layout active">
  <div class="upload-box">
    <h3 style="margin-bottom:10px;">Channel Logo ထည့်ပါ</h3>
    <img id="previewThumb" src="" alt="">
    <label for="fileInput" class="upload-btn">+ ပုံထည့်ရန် / လဲရန်</label>
    <input type="file" id="fileInput" accept="image/*">
    <p class="hint">ပုံသည် အဝိုင်းဖြစ်သွားမည်။<br>JPG, PNG ရသည်။ Link မလိုပါ။</p>
  </div>
</div>

<!-- VIEW LAYOUT -->
<div id="viewLayout" class="layout">
  <div class="logo-wrapper">
    <div class="rainbow-ring"></div>
    <div class="logo-circle" id="logoCircle">
      <div class="placeholder-text">ပုံမရှိသေးပါ<br>Edit မှာ ပုံထည့်ပါ</div>
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const previewThumb = document.getElementById('previewThumb');
  const logoCircle = document.getElementById('logoCircle');
  const editLayout = document.getElementById('editLayout');
  const viewLayout = document.getElementById('viewLayout');
  const btnEdit = document.getElementById('btnEdit');
  const btnView = document.getElementById('btnView');

  let currentImageData = null;

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentImageData = ev.target.result;
      previewThumb.src = currentImageData;
      previewThumb.style.display = 'block';
      // View layout ကို update လုပ်
      logoCircle.innerHTML = `<img src="${currentImageData}" alt="Logo">`;
    };
    reader.readAsDataURL(file);
  });

  // Layout Switch
  btnEdit.addEventListener('click', () => {
    editLayout.classList.add('active');
    viewLayout.classList.remove('active');
    btnEdit.style.opacity = '1';
    btnView.style.opacity = '0.6';
  });

  btnView.addEventListener('click', () => {
    viewLayout.classList.add('active');
    editLayout.classList.remove('active');
    btnView.style.opacity = '1';
    btnEdit.style.opacity = '0.6';
    if(!currentImageData){
      logoCircle.innerHTML = `<div class="placeholder-text">ပုံမရှိသေးပါ</div>`;
    }
  });

  // စစချင်းက Edit
  btnEdit.style.opacity = '1';
  btnView.style.opacity = '0.6';
</script>

</body>
</html>

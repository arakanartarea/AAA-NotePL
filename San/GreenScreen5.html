<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Green Webpage</title>
  <!-- Material Symbols Font Link -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      background-color: #00FF00;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 50px;
    }

    .button-container {
      display: flex;
      gap: 35px;
      background-color: white;
      padding: 12px 35px;
      border-radius: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .material-symbols-rounded {
      font-size: 32px;
      color: #000;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>

  <div class="button-container">
    <button><span class="material-symbols-rounded"></span></button>
    <button><span class="material-symbols-rounded">2</span></button>
    <button><span class="material-symbols-rounded">3</span></button>
  </div>

</body>
</html>

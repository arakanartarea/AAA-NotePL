<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAA Notes - LVE3 Style</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
:root{--primary:#E11D48;--bg:#F8FAFC;--card:#FFFFFF;--text:#1E293B;--muted:#94A3B8;--accent:#334155}
.dark-mode{--bg:#0F172A;--card:#1E293B;--text:#E2E8F0;--muted:#64748B;--accent:#F1F5F9}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:9px;padding-bottom:90px;margin:0}
.view-section{display:none}.view-section.active{display:block}
header{position:sticky;top:0;z-index:1100;display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:10px 14px;border-radius:12px;margin-bottom:12px;border:1px solid #E2E8F0}
.dark-mode header{border-color:#334155}
.nav-btns{flex:1;display:flex}
#search-input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid #E2E8F0;background:var(--bg);color:var(--text);outline:none}
.dark-mode #search-input{border-color:#334155;background:#0F172A}
.accordion{margin-bottom:8px;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden}
.dark-mode.accordion{border-color:#334155}
.accordion-header{background:var(--card);padding:12px;font-weight:bold;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--text);border-left:4px solid #EAB308}
.accordion.open.accordion-header{background:var(--bg);border-bottom:1px solid #E2E8F0}
.accordion-content{display:none;background:var(--bg);padding:8px}
.accordion.open.accordion-content{display:block}
.subgroup-header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--card);margin:6px 0 6px 14px;border-radius:8px;border:1px dashed #CBD5E1;cursor:pointer}
.dark-mode.subgroup-header{border-color:#475569}
.subgroup-content{display:none;padding-left:20px}
.subgroup.open.subgroup-content{display:block}
.song-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--card);margin:6px 0 6px 28px;border-radius:8px;border:1px solid #E2E8F0}
.note-content-view{white-space:pre-wrap;background:var(--card);padding:15px;border-radius:10px;border:1px solid #E2E8F0;line-height:1.7}
#auth-modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:grid;place-items:center;z-index:9999}
#auth-modal.hidden{display:none}
.auth-box{width:90%;max-width:360px;background:var(--card);border:1px solid #334155;border-radius:16px;padding:18px}
.btn-auth{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0F172A;color:#fff;cursor:pointer;margin-bottom:8px}
.btn-auth.primary{background:#2563eb;border-color:#2563eb}
#loading-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#111;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px}
.status-badge{font-size:11px;padding:4px 8px;border-radius:20px;background:#334155;cursor:pointer;color:#fff}
.form-group{margin-bottom:10px}.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;padding:10px;background:var(--card);border:1px solid #E2E8F0;border-radius:8px;color:var(--text);box-sizing:border-box;font-family:inherit}
.form-group:has(#inp-content){display:flex;flex-direction:column;height:65vh}
#inp-content{flex:1!important;min-height:400px;resize:none;font-family:monospace;white-space:pre}
</style>
</head>
<body>

<header id="main-header">
  <div class="nav-btns"><input type="text" id="search-input" placeholder="Group, SubGroup, Note ရှာရန်..." oninput="filterNotes()"></div>
  <div id="status-badge" class="status-badge">Firebase ချိတ်ဆက်ရန်</div>
</header>

<div id="loading-overlay">
  <div style="width:36px;height:36px;border:4px solid #333;border-top:4px solid #22c55e;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
</div>

<div id="list-view" class="view-section active">
  <div id="accordion-container">ခေါ်ယူနေသည်...</div>
  <div id="list-fab-container" style="position:fixed;bottom:27px;right:27px;z-index:1000;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;">
    <button onclick="openCreateForm()" title="Note အသစ်ထည့်" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">add</span></button>
    <button onclick="toggleListFabMenu()" title="ဆက်တင်များ" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">settings</span></button>
    <div id="list-fab-menu" style="display:none;flex-direction:column-reverse;gap:10px;align-items:flex-end;">
      <button id="btn-login" onclick="handleAuthClick()" title="Login" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">login</span></button>
      <button onclick="toggleTheme()" title="Theme" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;cursor:pointer;"><span class="material-symbols-rounded">dark_mode</span></button>
    </div>
  </div>
</div>

<div id="input-view" class="view-section">
  <h2 id="form-title">Note အသစ်</h2>
  <div class="form-group"><label>Group (ဥပမာ - တေးခြင်းကေါ့ထုတ်)</label><input type="text" id="inp-group"></div>
  <div class="form-group"><label>SubGroup (ဥပမာ - ကိုကိုနိုင်)</label><input type="text" id="inp-subgroup"></div>
  <div class="form-group"><label>Content</label><textarea id="inp-content" rows="12"></textarea></div>
  <div id="edit-fab-container" style="position:fixed;bottom:27px;right:27px;z-index:1000;display:none;flex-direction:column-reverse;align-items:flex-end;gap:10px;">
    <button onclick="saveNote()" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;"><span class="material-symbols-rounded">save</span></button>
    <button onclick="switchView('list-view')" style="width:54px;height:54px;background:var(--card);color:var(--text);border:1px solid #E2E8F0;border-radius:50%;display:grid;place-items:center;"><span class="material-symbols-rounded">arrow_back</span></button>
  </div>
</div>

<div id="view-view" class="view-section">
  <div style="padding:10px"><button onclick="switchView('list-view')" style="padding:8px 12px;border-radius:8px;border:1px solid #E2E8F0;background:var(--card);cursor:pointer">← Back</button></div>
  <div id="view-meta" style="padding:0 10px 10px 10px;color:var(--muted)"></div>
  <div id="view-content" class="note-content-view" style="margin:10px"></div>
</div>

<div id="auth-modal" class="hidden">
  <div class="auth-box">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
      <span class="material-symbols-rounded" style="font-size:28px;color:#eab308;">account_circle</span>
      <div><div style="font-weight:700" id="auth-modal-email">email</div><div style="font-size:12px;color:var(--muted)">Admin အကောင့်ဝင်ထားသည်</div></div>
    </div>
    <button id="btn-auth-cancel" class="btn-auth">Close</button>
    <button id="btn-auth-logout" class="btn-auth">Logout</button>
    <button id="btn-auth-switch" class="btn-auth primary">အကောင့်ပြောင်းမယ်</button>
  </div>
</div>

<script>
// ===== FIREBASE CONFIG - မင်းဟာအတိုင်း =====
const firebaseConfig = {
  apiKey: "AIzaSyCdPFzE2_Rbg8Xi-9DGBvfoOA95c1R3S4U",
  authDomain: "arakanartarea-note.firebaseapp.com",
  projectId: "arakanartarea-note",
  storageBucket: "arakanartarea-note.firebasestorage.app",
  messagingSenderId: "695659736666",
  appId: "1:695659736666:web:1e76494c0e6819609bf263"
};
let db=null, auth=null, editingDocId=null, isAdminUser=false, currentUser=null, allNotesData=[];

function initFirebase(){
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db=firebase.firestore(); auth=firebase.auth();
  const urlParams = new URLSearchParams(window.location.search);
  const persistence = urlParams.get('keep')==='no'? firebase.auth.Auth.Persistence.SESSION : firebase.auth.Auth.Persistence.LOCAL;
  auth.setPersistence(persistence);
  auth.onAuthStateChanged(async (user)=>{
    currentUser=user;
    if(!user){ isAdminUser=false; updateAuthUI(); return; }
    try{
      const adminDoc = await db.collection('admins').doc(user.email.toLowerCase()).get();
      isAdminUser = adminDoc.exists;
    }catch(e){ isAdminUser=false; }
    updateAuthUI();
  });
  fetchNotes();
}
function hideLoading(){ const o=document.getElementById('loading-overlay'); if(o) o.style.display='none'; }

// ===== AUTH UI - AAASongs အတိုင်း 100% တူ =====
function handleAuthClick(){
  if(currentUser){
    document.getElementById('auth-modal-email').textContent=currentUser.email;
    document.getElementById('auth-modal').classList.remove('hidden');
  }else{ doLogin(); }
}
function closeAuthModal(){ document.getElementById('auth-modal')?.classList.add('hidden'); }
function doLogin(){ const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'}); auth.signInWithPopup(p).catch(e=>alert(e.message)); }
function doLogout(){ closeAuthModal(); auth.signOut(); }
function doSwitchAccount(){ closeAuthModal(); auth.signOut().then(()=>setTimeout(doLogin,400)); }
function updateAuthUI(){
  const badge=document.getElementById('status-badge');
  const addBtn=document.querySelector('#list-fab-container button[onclick="openCreateForm()"]');
  const loginBtn=document.getElementById('btn-login');
  if(badge){
    if(isAdminUser && currentUser){
      badge.textContent=`Admin: ${currentUser.displayName||currentUser.email.split('@')[0]}`;
      badge.style.background='#16a34a'; badge.style.color='#fff';
    }else{
      badge.textContent=currentUser? `Viewer: ${currentUser.email.split('@')[0]}`:'Viewer';
      badge.style.background='#eab308'; badge.style.color='#000';
    }
  }
  if(loginBtn){ const ic=loginBtn.querySelector('.material-symbols-rounded'); if(ic) ic.textContent=currentUser?'logout':'login'; }
  if(addBtn) addBtn.style.display=isAdminUser?'':'none';
  document.querySelectorAll('.item-actions').forEach(el=> el.style.display=isAdminUser?'':'none');
}
(function setupAuthOnce(){
  document.getElementById('btn-auth-cancel')?.addEventListener('click',closeAuthModal);
  document.getElementById('btn-auth-logout')?.addEventListener('click',doLogout);
  document.getElementById('btn-auth-switch')?.addEventListener('click',doSwitchAccount);
  document.getElementById('auth-modal')?.addEventListener('click',(e)=>{ if(e.target.id==='auth-modal') closeAuthModal(); });
  document.getElementById('status-badge')?.addEventListener('click',handleAuthClick);
})();

// ===== VIEW CONTROL - AAASongs အတိုင်း =====
function switchView(viewId, isBack=false){
  if(!isBack && viewId!=='list-view') history.pushState({view:viewId},'');
  document.querySelectorAll('.view-section').forEach(el=>el.classList.remove('active'));
  document.getElementById(viewId)?.classList.add('active');
  const isList=viewId==='list-view', isEdit=viewId==='input-view';
  document.getElementById('main-header').style.display=isList?'flex':'none';
  document.getElementById('list-fab-container').style.display=isList?'flex':'none';
  document.getElementById('edit-fab-container').style.display=(isEdit && isAdminUser)?'flex':'none';
}
window.addEventListener('popstate',()=>{ const a=document.querySelector('.view-section.active')?.id; if(a && a!=='list-view') switchView('list-view',true); });

// ===== NOTES LOGIC - ဒီနေရာပဲ AAAnotes အတွက် ပြောင်းထားတာ =====
function fetchNotes(){
  if(!db) return;
  db.collection('AAAnotes').onSnapshot(snap=>{
    allNotesData=[];
    snap.forEach(doc=>{ const d=doc.data(); d.id=doc.id; allNotesData.push(d); });
    filterNotes();
    hideLoading();
  });
}
function filterNotes(){
  const q=(document.getElementById('search-input')?.value||'').toLowerCase().trim();
  const filtered = allNotesData.filter(n=>{
    if(n.role===2) return false;
    return (n.group||'').toLowerCase().includes(q) ||
           (n.subGroup||'').toLowerCase().includes(q) ||
           (n.content||'').toLowerCase().includes(q);
  });
  // Group > SubGroup structure
  const grouped={};
  filtered.forEach(n=>{
    const g=n.group||'အခြား'; const sg=n.subGroup||'အထွေထွေ';
    if(!grouped[g]) grouped[g]={};
    if(!grouped[g][sg]) grouped[g][sg]=[];
    grouped[g][sg].push(n);
  });
  renderAccordion(grouped);
}
function renderAccordion(grouped){
  const container=document.getElementById('accordion-container');
  container.innerHTML='';
  if(Object.keys(grouped).length===0){ container.innerHTML='<p style="color:var(--muted)">ဘာမှမရှိသေးပါ</p>'; return; }
  for(const [groupName, subGroups] of Object.entries(grouped)){
    const acc=document.createElement('div'); acc.className='accordion';
    let subHtml='';
    for(const [subName, notes] of Object.entries(subGroups)){
      const notesHtml = notes.map(note=>`
        <div class="song-item">
          <span style="flex:1;cursor:pointer" onclick="viewNote('${note.id}')">📝 ${escapeHtml(note.content.substring(0,60))}</span>
          <div class="item-actions" style="display:${isAdminUser?'flex':'none'};gap:6px">
            <button class="icon-btn" onclick="editNote('${note.id}')">✏️</button>
            <button class="icon-btn" onclick="deleteNote('${note.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
      subHtml+=`
        <div class="subgroup">
          <div class="subgroup-header" onclick="this.parentElement.classList.toggle('open')"><span>📂 ${escapeHtml(subName)} (${notes.length})</span><span>▼</span></div>
          <div class="subgroup-content">${notesHtml}</div>
        </div>`;
    }
    const totalCount = Object.values(subGroups).reduce((a,b)=>a+b.length,0);
    acc.innerHTML=`<div class="accordion-header" onclick="this.parentElement.classList.toggle('open')"><span>📁 ${escapeHtml(groupName)} (${totalCount})</span><span>▼</span></div><div class="accordion-content">${subHtml}</div>`;
    container.appendChild(acc);
  }
}
function openCreateForm(){
  if(!isAdminUser){ alert('Admin login ဝင်မှ ထည့်လို့ရမယ်'); return; }
  editingDocId=null;
  document.getElementById('form-title').textContent='Note အသစ်ထည့်';
  document.getElementById('inp-group').value=''; document.getElementById('inp-subgroup').value=''; document.getElementById('inp-content').value='';
  switchView('input-view');
}
function editNote(id){
  if(!isAdminUser) return;
  db.collection('AAAnotes').doc(id).get().then(doc=>{
    if(!doc.exists) return;
    const d=doc.data(); editingDocId=id;
    document.getElementById('form-title').textContent='Note ပြင်ဆင်ရန်';
    document.getElementById('inp-group').value=d.group||'';
    document.getElementById('inp-subgroup').value=d.subGroup||'';
    document.getElementById('inp-content').value=d.content||'';
    switchView('input-view');
  });
}
function saveNote(){
  if(!isAdminUser) return;
  const payload={
    group:document.getElementById('inp-group').value.trim(),
    subGroup:document.getElementById('inp-subgroup').value.trim(),
    content:document.getElementById('inp-content').value.trim(),
    updateTime:new Date().toISOString(),
    role:1, fav:false
  };
  if(!payload.group ||!payload.subGroup ||!payload.content){ alert('အကုန်ဖြည့်ပါ'); return; }
  if(editingDocId){ db.collection('AAAnotes').doc(editingDocId).update(payload).then(()=>switchView('list-view')); }
  else{ db.collection('AAAnotes').add(payload).then(()=>switchView('list-view')); }
}
function deleteNote(id){
  if(!isAdminUser) return;
  if(confirm('အမှိုက်ပုံးထဲ ပို့မှာလား?')){ db.collection('AAAnotes').doc(id).update({role:2, updateTime:new Date().toISOString()}); }
}
function viewNote(id){
  db.collection('AAAnotes').doc(id).get().then(doc=>{
    if(!doc.exists) return;
    const d=doc.data();
    document.getElementById('view-meta').textContent=`${d.group} / ${d.subGroup} • ${d.updateTime||''}`;
    document.getElementById('view-content').textContent=d.content||'';
    switchView('view-view');
  });
}
function escapeHtml(s){ const div=document.createElement('div'); div.textContent=s; return div.innerHTML; }
function toggleListFabMenu(){ const m=document.getElementById('list-fab-menu'); if(m) m.style.display=(m.style.display==='none'||!m.style.display)?'flex':'none'; }
let isDark=localStorage.getItem('theme')==='dark';
function toggleTheme(){ isDark=!isDark; localStorage.setItem('theme',isDark?'dark':'light'); document.body.classList.toggle('dark-mode',isDark); }
window.onload=()=>{ initFirebase(); document.body.classList.toggle('dark-mode',localStorage.getItem('theme')==='dark'); switchView('list-view'); };
</script>
</body>
</html>

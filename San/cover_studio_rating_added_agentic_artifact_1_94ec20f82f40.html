        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Myanmar:wght@600;700&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{background:#0a0a0c;color:#fff;font-family:Inter,'Noto Sans Myanmar',sans-serif}
        .my{font-family:'Noto Sans Myanmar',sans-serif}
        .top{height:52px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.06);background:#0e0e11;position:sticky;top:0;z-index:10}
        .logo{display:flex;gap:10px;align-items:center}
        .logo-b{width:32px;height:32px;border-radius:50%;background:#FFE066;color:#000;display:grid;place-items:center;font-weight:800;font-size:13px}
        .b1{font-size:11px;letter-spacing:.12em;font-weight:700}
        .b2{font-size:10px;opacity:.45}
        .main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
        .wrap{max-width:980px;width:100%;margin:0 auto;padding:12px;flex:1;display:flex;flex-direction:column}
        .card{background:#17171a;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px}
        .grid2{display:grid;grid-template-columns:210px 1fr;gap:14px}
        @media(max-width:720px){.grid2{grid-template-columns:1fr}}
        .ibox{aspect-ratio:16/10;background:#101012;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
        .ibox img{width:100%;height:100%;object-fit:cover}
        .ibox::after{content:'Change';position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);padding:4px 10px;border-radius:999px;font-size:10px;opacity:.8}
        .lab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600;margin-bottom:5px;display:block}
        .inp{width:100%;height:38px;padding:0 11px;border-radius:10px;background:#101012;border:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px;outline:none;transition:border .15s}
        .inp:focus{border-color:rgba(255,214,10,.35)}
        .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .full{grid-column:1/-1}
        .cus{display:flex;gap:6px;margin-bottom:6px}
        .btn2{height:36px;padding:0 16px;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:13px}
        .white{background:#fff;color:#000}

        .sbtn:hover{border-color:rgba(255,214,10,.4);color:#FFE066}
        .rate-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.25);padding:5px 11px;border-radius:999px;font-size:11px;color:#FFD60A;font-weight:700;letter-spacing:.02em}

        .imgw-h{width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:1.5px solid rgba(255,214,10,.7);background:#000;flex-shrink:0}
        .imgw-h img{width:100%;height:100%;object-fit:cover;display:block}

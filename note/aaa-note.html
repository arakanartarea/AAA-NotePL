<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAA Final</title></head><body style="font-family:sans-serif">
<div style="padding:10px;border-bottom:1px solid #ccc;display:flex;gap:10px"><input id="searchBox" placeholder="Search" style="flex:1;padding:10px;border-radius:20px;border:1px solid #ccc"><button id="authBtn" style="width:44px;height:44px;border-radius:50%">👤</button></div>
<div id="status" style="padding:10px;background:#fff3cd;text-align:center;font-size:14px">Checking...</div>
<div id="expandable-list" style="padding:15px"></div>
<div id="view-screen" style="display:none"></div><div id="edit-screen" style="display:none"><input id="group" placeholder="group" style="width:45%"><input id="subGroup" placeholder="subGroup" style="width:45%"><br><textarea id="content" style="width:95%;height:200px"></textarea><br><button id="cancel-edit-btn">Back</button><button id="save-word-btn">Save</button></div>
<div id="main-screen"><button id="new-word-btn">+ New</button> <select id="sort-select"><option value="time-new">New</option><option value="az">A-Z</option></select> <select id="Screen-select"><option>Menu</option></select></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCdPFzE2_Rbg8Xi-9DGBvfoOA95c1R3S4U", authDomain: "arakanartarea-note.firebaseapp.com", projectId: "arakanartarea-note", storageBucket: "arakanartarea-note.firebasestorage.app", messagingSenderId: "695659736666", appId: "1:695659736666:web:1e76494c0e6819609bf263" };
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app); const provider=new GoogleAuthProvider();
let allWords=[], unsubscribe=null;
const statusEl=document.getElementById('status'), listEl=document.getElementById('expandable-list');
window.doLogin=()=>signInWithRedirect(auth,provider); window.doLogout=()=>signOut(auth);
document.getElementById('authBtn').onclick=()=>{ if(!auth.currentUser) window.doLogin(); else window.doLogout(); };
document.getElementById('new-word-btn').onclick=()=>{ document.getElementById('edit-screen').style.display='block'; };
document.getElementById('cancel-edit-btn').onclick=()=>{ document.getElementById('edit-screen').style.display='none'; };
getRedirectResult(auth).catch(e=>{ statusEl.innerHTML="Login Error: "+e.message; });
onAuthStateChanged(auth, async(user)=>{
  if(unsubscribe){unsubscribe(); unsubscribe=null;}
  if(!user){ statusEl.innerHTML=`Not logged in - <button onclick="doLogin()">Login</button>`; listEl.innerHTML=""; return; }
  statusEl.innerHTML=`Logged in as: ${user.email} - Checking admin...`;
  try{
    const adminDoc = await getDoc(doc(db,"admins",user.email));
    if(!adminDoc.exists()){ statusEl.innerHTML=`${user.email} is NOT admin. Fix: make doc ID = this email`; listEl.innerHTML=`<button onclick="doLogout()">Logout</button>`; return; }
    statusEl.innerHTML=`Admin OK: ${user.email} ✅ Loading notes...`;
    unsubscribe = onSnapshot(collection(db,"AAAnotes"), (snap)=>{
      allWords=[]; snap.forEach(d=>allWords.push({id:d.id,...d.data()}));
      statusEl.innerHTML=`Loaded ${allWords.length} notes for ${user.email}`;
      listEl.innerHTML=allWords.map(n=>`<div style="border-left:4px solid #605639;padding:10px;margin-bottom:10px;background:white">${n.content||'-'}<br><small>${n.group||''}/${n.subGroup||''}</small></div>`).join('');
    }, (err)=>{ statusEl.innerHTML="Firestore Error: "+err.message; listEl.innerHTML=err.message+"<br>Check Rules Publish"; });
  }catch(e){ statusEl.innerHTML="Error: "+e.message; }
});
</script></body></html>

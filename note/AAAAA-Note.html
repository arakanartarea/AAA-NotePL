<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<link rel="stylesheet" href="aaa-note-style.css">
</head>
<body>
<div class="notepad-container">
<div id="main-screen" class="screen">
<header>
<div style="padding:10px 15px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;">
<div style="position:relative;flex:1;display:flex;align-items:center;">
<span style="position:absolute;left:12px;color:#999;">🔍</span>
<input type="text" id="searchBox" placeholder="ရှာရန်..." style="width:100%;padding:10px 35px;border:1px solid #ccc;border-radius:20px;outline:none;">
<button id="clearSearchBtn" style="position:absolute;right:8px;background:none;border:none;font-size:18px;display:none;">✖</button>
</div>
<button id="authBtn" style="width:40px;height:40px;border-radius:50%;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;">👤</button>
</div>
</header>
<main class="content-area"><div id="expandable-list"></div></main>
<div class="bottom-toolbar" style="display:flex;overflow-x:auto;white-space:nowrap;padding:10px;background:#605639;gap:10px;">
<button id="new-word-btn" style="padding:8px 16px;background:#e6dbb3;border:none;border-radius:20px;font-weight:bold;">➕ New</button>
<select id="sort-select" style="padding:8px 16px;background:#e6dbb3;border:none;border-radius:20px;font-weight:bold;"><option value="time-new">🕐 အသစ်ဆုံး</option><option value="time-old">🕐 အဟောင်းဆုံး</option><option value="az">🔤 A-Z</option><option value="za">🔤 Z-A</option></select>
</div>
</div>
<div id="view-screen" class="screen hidden"></div>
<div id="edit-screen" class="screen hidden" style="display:flex;flex-direction:column;height:100vh;">
<div style="padding:10px;background:#e6dbb3;display:flex;gap:8px;"><input type="text" id="group" placeholder="အုပ်စု" style="flex:1;padding:8px;border:1px solid #999;border-radius:4px;"><input type="text" id="subGroup" placeholder="အုပ်စုခွဲ" style="flex:1;padding:8px;border:1px solid #999;border-radius:4px;"></div>
<textarea id="content" placeholder="မှတ်စု..." style="flex:1;padding:12px;border:none;resize:none;font-size:16px;outline:none;"></textarea>
<div id="editor-toolbar" style="display:flex;gap:4px;padding:8px;background:#f5f5f5;border-top:1px solid #ddd;"><button data-cmd="undo">↶</button><button data-cmd="redo">↷</button><div style="flex:1"></div><button id="cancel-edit-btn" style="padding:8px 16px;background:#605639;color:white;border:none;border-radius:4px;">⬅️</button><button id="save-word-btn" style="padding:8px 16px;background:#2d6a4f;color:white;border:none;border-radius:4px;">💾</button></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, signOut, onAuthStateChanged, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
const firebaseConfig = { apiKey:"AIzaSyCdPFzE2_Rbg8Xi-9DGBvfoOA95c1R3S4U", authDomain:"arakanartarea-note.firebaseapp.com", projectId:"arakanartarea-note", storageBucket:"arakanartarea-note.firebasestorage.app", messagingSenderId:"695659736666", appId:"1:695659736666:web:1e76494c0e6819609bf263"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const adminEmail = "zawmyo@gmail.com";
let unsubscribe=null;
getRedirectResult(auth).catch(e=>alert(e.message));
let currentEditId=null, currentSearchText="", allWords=[], currentSortMode='time-new';
const mainScreen=document.getElementById('main-screen'), editScreen=document.getElementById('edit-screen'), viewScreen=document.getElementById('view-screen'), expandableList=document.getElementById('expandable-list');
function changeScreen(t){mainScreen.classList.add('hidden');editScreen.classList.add('hidden');viewScreen.classList.add('hidden');t.classList.remove('hidden');}
document.getElementById('new-word-btn').onclick=()=>{currentEditId=null; document.getElementById('group').value=""; document.getElementById('subGroup').value=""; document.getElementById('content').value=""; changeScreen(editScreen);};
document.getElementById('sort-select').onchange=e=>{currentSortMode=e.target.value; showWords();};
function startListening(){if(unsubscribe) unsubscribe(); unsubscribe=onSnapshot(collection(db,"AAAnotes"),s=>{allWords=[]; s.forEach(d=>{if(d.data().role!==2) allWords.push({id:d.id,...d.data()})}); showWords();});}
const authBtn=document.getElementById('authBtn');
authBtn.onclick=()=>{ if(!auth.currentUser) signInWithRedirect(auth,provider); else { if(confirm("ထွက်မလား?")) signOut(auth); else signInWithRedirect(auth,provider);} };
onAuthStateChanged(auth,user=>{ if(!user){authBtn.innerText="👤"; expandableList.innerHTML="<p style='text-align:center;padding:30px'>Login ဝင်ပါ</p>"; return;} if(user.email!==adminEmail){authBtn.innerText="🚫"; expandableList.innerHTML=`<p style='text-align:center;padding:30px'>${user.email}<br>ခွင့်မရှိ</p>`; return;} authBtn.innerText="✅"; startListening();});
function showWords(){ expandableList.innerHTML=""; let filtered=allWords.filter(n=>{let s=currentSearchText.toLowerCase(); return (n.group||"").toLowerCase().includes(s)||(n.subGroup||"").toLowerCase().includes(s)||(n.content||"").toLowerCase().includes(s);}); if(filtered.length===0){expandableList.innerHTML="<p style='text-align:center;color:#888'>ရှာမတွေ့ပါ</p>"; return;} const groups={}; filtered.forEach(d=>{d.group=d.group||"အခြား"; d.subGroup=d.subGroup||"အထွေထွေ"; if(!groups[d.group]) groups[d.group]={}; if(!groups[d.group][d.subGroup]) groups[d.group][d.subGroup]=[]; groups[d.group][d.subGroup].push(d);}); Object.keys(groups).forEach(g=>{let gw=document.createElement('div'); gw.style.marginBottom="8px"; let gh=document.createElement('div'); gh.style.cssText="cursor:pointer;padding:12px;background:#e6dbb3;font-weight:bold;border-radius:4px;"; gh.innerText="📁 "+g; let box=document.createElement('div'); box.style.display="none"; box.style.paddingLeft="10px"; Object.keys(groups[g]).forEach(sg=>{let sh=document.createElement('div'); sh.style.cssText="padding:10px;margin-top:5px;background:#f1f1f1;border-radius:4px;cursor:pointer;"; sh.innerText="📂 "+sg; sh.onclick=e=>{e.stopPropagation(); showSub(sg,g,groups[g][sg]);}; box.appendChild(sh);}); gh.onclick=()=>{document.querySelectorAll('.subbox').forEach(b=>b.style.display="none"); box.style.display=box.style.display==="block"?"none":"block";}; box.className="subbox"; gw.appendChild(gh); gw.appendChild(box); expandableList.appendChild(gw);});}
function showSub(sg,g,notes){ viewScreen.innerHTML=`<div style="padding:15px;background:#e6dbb3;font-weight:bold;">${g}/${sg} (${notes.length})</div><div id="vc" style="padding:15px;padding-bottom:80px;"></div><div style="position:fixed;bottom:0;width:100%;padding:12px;background:#e6dbb3;display:flex;gap:10px;"><button id="bm" style="flex:1;padding:10px;background:#605639;color:white;border:none;border-radius:4px;">⬅️ Back</button><button id="bn" style="flex:1;padding:10px;background:#2d6a4f;color:white;border:none;border-radius:4px;">➕ New</button></div>`; let c=document.getElementById('vc'); notes.forEach(d=>{let el=document.createElement('div'); el.style.cssText="padding:12px;margin-bottom:10px;background:white;border-left:4px solid #605639;"; el.innerHTML=`<p style="white-space:pre-wrap;">${d.content}</p><div style="text-align:right;"><button class="ed" style="padding:4px 10px;">✏️</button></div>`; el.querySelector('.ed').onclick=()=>{currentEditId=d.id; document.getElementById('group').value=d.group; document.getElementById('subGroup').value=d.subGroup; document.getElementById('content').value=d.content; changeScreen(editScreen);}; c.appendChild(el);}); document.getElementById('bm').onclick=()=>changeScreen(mainScreen); document.getElementById('bn').onclick=()=>{currentEditId=null; document.getElementById('group').value=g; document.getElementById('subGroup').value=sg; document.getElementById('content').value=""; changeScreen(editScreen);}; changeScreen(viewScreen);}
document.getElementById('searchBox').oninput=e=>{currentSearchText=e.target.value; showWords();};
document.getElementById('cancel-edit-btn').onclick=()=>changeScreen(mainScreen);
document.getElementById('save-word-btn').onclick=async()=>{let data={group:document.getElementById('group').value||"အခြား", subGroup:document.getElementById('subGroup').value||"အထွေထွေ", content:document.getElementById('content').value.trim(), role:1, updateTime:new Date().toISOString()}; if(!data.content) return alert("စာဖြည့်"); if(currentEditId) await updateDoc(doc(db,"AAAnotes",currentEditId),data); else await addDoc(collection(db,"AAAnotes"),data); changeScreen(mainScreen);};
</script>
</body>
</html>
